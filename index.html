<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lifts">
<title>Lifts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e10;
  --surface: #18181b;
  --surface2: #222226;
  --surface3: #2a2a2f;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f4f4f5;
  --text2: #a1a1aa;
  --text3: #52525b;
  --accent: #c8f135;
  --accent-dim: rgba(200,241,53,0.12);
  --accent-text: #0e0e10;
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.12);
  --green: #c8f135;
  --green-dim: rgba(200,241,53,0.1);
  --radius: 14px;
  --radius-sm: 9px;
  --font-display: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font-body);color:var(--text);font-size:15px}

/* APP SHELL */
#app{height:100vh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;display:none;flex-direction:column;padding-bottom:2rem;-webkit-overflow-scrolling:touch}
.screen.active{display:flex}

/* NAV BAR */
.nav{padding:env(safe-area-inset-top, 14px) 20px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--bg)}
.nav-title{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-0.3px}
.nav-back{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:14px;font-weight:500;background:none;border:none;cursor:pointer;padding:4px 0}
.nav-icon{background:none;border:none;cursor:pointer;color:var(--text2);font-size:22px;display:flex;align-items:center;padding:4px}

/* HOME */
.home-header{padding:8px 20px 20px}
.home-greeting{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-0.5px;line-height:1.1}
.home-sub{font-size:13px;color:var(--text2);margin-top:4px}
.section-label{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);padding:0 20px;margin-bottom:10px}
.muscle-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 20px;margin-bottom:24px}
.muscle-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:background 0.15s,border-color 0.15s;position:relative;overflow:hidden;-webkit-user-select:none}
.muscle-card:active{background:var(--surface2);border-color:var(--border2)}
.muscle-emoji{font-size:26px;margin-bottom:8px;display:block}
.muscle-name{font-family:var(--font-display);font-size:15px;font-weight:700}
.muscle-tag{font-size:11px;color:var(--text3);margin-top:2px}
.muscle-count{position:absolute;top:12px;right:12px;background:var(--accent-dim);color:var(--accent);font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}

/* RECENT */
.recent-list{padding:0 20px}
.recent-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background 0.15s}
.recent-card:active{background:var(--surface2)}
.recent-name{font-family:var(--font-display);font-size:14px;font-weight:600}
.recent-meta{font-size:12px;color:var(--text2);margin-top:2px}
.recent-arrow{color:var(--text3);font-size:18px}

/* EXERCISE LIST */
.ex-list{padding:0 20px}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background 0.15s}
.ex-card:active{background:var(--surface2)}
.ex-card-name{font-family:var(--font-display);font-size:14px;font-weight:600}
.ex-card-meta{font-size:12px;color:var(--text2);margin-top:2px}
.ex-card-arrow{color:var(--text3);font-size:18px}
.add-ex-btn{margin:4px 20px 0;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius);padding:14px 16px;width:calc(100% - 40px);display:flex;align-items:center;gap:10px;color:var(--text2);font-size:14px;cursor:pointer;font-family:var(--font-body)}
.add-ex-btn:active{background:var(--surface2)}

/* ADD EXERCISE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:24px 20px calc(env(safe-area-inset-bottom,16px) + 16px);width:100%;max-width:430px}
.modal-title{font-family:var(--font-display);font-size:17px;font-weight:700;margin-bottom:16px}
.modal input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:15px;font-family:var(--font-body);outline:none;margin-bottom:12px}
.modal input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-display);border:none;letter-spacing:0.01em}
.btn-primary{background:var(--accent);color:var(--accent-text)}
.btn-primary:active{opacity:0.85}
.btn-secondary{background:var(--surface2);color:var(--text2)}
.btn-secondary:active{opacity:0.7}

/* LOG SCREEN */
.log-header{padding:0 20px 16px}
.log-ex-name{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-0.3px}
.log-muscle{font-size:13px;color:var(--text2);margin-top:3px}
.date-row{padding:0 20px 20px;display:flex;align-items:center;gap:10px}
.date-row label{font-size:13px;color:var(--text2);flex-shrink:0}
.date-row input[type=date]{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:14px;font-family:var(--font-body);outline:none;flex:1}
.date-row input[type=date]:focus{border-color:var(--accent)}
.col-labels{display:grid;grid-template-columns:36px 1fr 1fr 32px;gap:8px;padding:0 20px;margin-bottom:6px}
.col-lbl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:0.05em;text-transform:uppercase;text-align:center}
.sets-list{padding:0 20px}
.set-row{display:grid;grid-template-columns:36px 1fr 1fr 32px;gap:8px;align-items:center;margin-bottom:8px}
.set-num{font-size:12px;color:var(--text3);text-align:center;font-weight:600}
.set-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;color:var(--text);font-size:15px;font-family:var(--font-body);text-align:center;outline:none;width:100%}
.set-input:focus{border-color:var(--accent)}
.set-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;padding:4px}
.set-del:active{color:var(--red)}
.action-row{display:flex;gap:10px;padding:12px 20px 20px}
.add-set-btn{flex:1;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius-sm);padding:11px;font-size:14px;color:var(--text2);cursor:pointer;font-family:var(--font-body);display:flex;align-items:center;justify-content:center;gap:6px}
.save-btn{flex:2;background:var(--accent);border:none;border-radius:var(--radius-sm);padding:11px;font-size:14px;font-weight:700;color:var(--accent-text);cursor:pointer;font-family:var(--font-display);display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:0.01em}
.save-btn:active{opacity:0.85}

/* AI COACH */
.ai-box{margin:0 20px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.ai-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;-webkit-user-select:none}
.ai-header-left{display:flex;align-items:center;gap:10px}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.ai-title{font-family:var(--font-display);font-size:14px;font-weight:700}
.ai-chevron{color:var(--text3);font-size:18px;transition:transform 0.2s}
.ai-chevron.open{transform:rotate(180deg)}
.ai-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.ai-body.open{display:block}
.ai-ask-btn{width:100%;background:var(--accent-dim);border:1px solid rgba(200,241,53,0.2);border-radius:var(--radius-sm);padding:11px;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;font-family:var(--font-display);margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:0.01em}
.ai-ask-btn:active{opacity:0.8}
.ai-ask-btn:disabled{opacity:0.5;cursor:default}
.ai-response{margin-top:12px;font-size:13px;line-height:1.6;color:var(--text2);white-space:pre-wrap}
.ai-response.loading{color:var(--text3)}
.ai-response strong{color:var(--text);font-weight:600}

/* HISTORY */
.history-wrap{padding:0 20px}
.hist-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px}
.hist-date{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.hist-today{background:var(--accent-dim);color:var(--accent);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:0.04em;text-transform:uppercase}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-set{font-size:13px;color:var(--text)}
.hist-badges{display:flex;gap:4px}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.badge-up{background:var(--green-dim);color:var(--green)}
.badge-down{background:var(--red-dim);color:var(--red)}
.badge-same{background:var(--surface2);color:var(--text3)}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:14px;line-height:1.6}

/* TOAST */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,16px) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:9px 18px;border-radius:30px;opacity:0;transition:all 0.25s;pointer-events:none;z-index:200;white-space:nowrap;font-family:var(--font-display)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="nav">
      <div class="nav-title">Lifts 🏋️</div>
      <div style="font-size:12px;color:var(--text3)" id="nav-date"></div>
    </div>
    <div class="home-header">
      <div class="home-greeting" id="greeting"></div>
      <div class="home-sub" id="home-sub"></div>
    </div>
    <div class="section-label">Muscle groups</div>
    <div class="muscle-grid" id="muscle-grid"></div>
    <div id="recent-section"></div>
  </div>

  <!-- EXERCISE LIST -->
  <div class="screen" id="screen-exercises">
    <div class="nav">
      <button class="nav-back" onclick="goHome()">← Home</button>
      <div class="nav-title" id="muscle-screen-title"></div>
      <div style="width:60px"></div>
    </div>
    <div class="ex-list" id="exercise-list"></div>
    <button class="add-ex-btn" onclick="openAddExercise()">
      <span style="font-size:20px">＋</span> Add custom exercise
    </button>
  </div>

  <!-- LOG SCREEN -->
  <div class="screen" id="screen-log">
    <div class="nav">
      <button class="nav-back" id="log-back-btn">← Back</button>
      <div style="width:60px"></div>
    </div>
    <div class="log-header">
      <div class="log-ex-name" id="log-ex-name"></div>
      <div class="log-muscle" id="log-ex-muscle"></div>
    </div>
    <div class="date-row">
      <label>Date</label>
      <input type="date" id="log-date">
    </div>
    <div class="col-labels">
      <div class="col-lbl"></div>
      <div class="col-lbl">Weight</div>
      <div class="col-lbl">Reps</div>
      <div class="col-lbl"></div>
    </div>
    <div class="sets-list" id="sets-container"></div>
    <div class="action-row">
      <button class="add-set-btn" onclick="addSet()">＋ Set</button>
      <button class="save-btn" onclick="saveLog()">✓ Save</button>
    </div>

    <!-- AI COACH -->
    <div class="ai-box">
      <div class="ai-header" onclick="toggleAI()">
        <div class="ai-header-left">
          <div class="ai-dot"></div>
          <div class="ai-title">AI Coach</div>
        </div>
        <span class="ai-chevron" id="ai-chevron">▼</span>
      </div>
      <div class="ai-body" id="ai-body">
        <div style="padding-top:12px;font-size:13px;color:var(--text2);line-height:1.6">
          Get personalised progressive overload advice based on your logged history for this exercise.
        </div>
        <button class="ai-ask-btn" id="ai-ask-btn" onclick="askAI()">✦ Analyse my progress</button>
        <div class="ai-response" id="ai-response"></div>
      </div>
    </div>

    <div style="padding:0 20px 4px" class="section-label">History</div>
    <div class="history-wrap" id="history-area"></div>
  </div>

  <!-- ADD EXERCISE MODAL -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-title">Add exercise</div>
      <input type="text" id="new-ex-name" placeholder="Exercise name" maxlength="50">
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeAddExercise()">Cancel</button>
        <button class="btn btn-primary" onclick="confirmAddExercise()">Add</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const MUSCLES = [
  {id:'chest',name:'Chest',emoji:'🫁',tag:'Push',exercises:['Bench Press','Incline Bench Press','Dumbbell Fly','Cable Fly','Chest Dip','Push-Up']},
  {id:'back',name:'Back',emoji:'🔙',tag:'Pull',exercises:['Deadlift','Pull-Up','Barbell Row','Seated Cable Row','Lat Pulldown','Single-Arm Row']},
  {id:'shoulders',name:'Shoulders',emoji:'🏋️',tag:'Push',exercises:['Overhead Press','Lateral Raise','Front Raise','Face Pull','Arnold Press','Shrug']},
  {id:'legs',name:'Legs',emoji:'🦵',tag:'Lower',exercises:['Squat','Romanian Deadlift','Leg Press','Leg Curl','Leg Extension','Hip Thrust','Calf Raise']},
  {id:'biceps',name:'Biceps',emoji:'💪',tag:'Pull',exercises:['Barbell Curl','Dumbbell Curl','Hammer Curl','Preacher Curl','Cable Curl','Incline Curl']},
  {id:'triceps',name:'Triceps',emoji:'🤜',tag:'Push',exercises:['Skull Crusher','Tricep Pushdown','Overhead Tricep Extension','Close-Grip Bench','Dip','Kickback']},
  {id:'core',name:'Core',emoji:'⚡',tag:'Accessory',exercises:['Plank','Cable Crunch','Hanging Leg Raise','Ab Wheel','Russian Twist','Side Plank']},
  {id:'glutes',name:'Glutes',emoji:'🍑',tag:'Lower',exercises:['Hip Thrust','Glute Bridge','Cable Kickback','Bulgarian Split Squat','Sumo Deadlift','Abductor Machine']},
];

let currentMuscle = null;
let currentExercise = null;
let sets = [];
let logs = {};
let customExercises = {};

function load() {
  try { logs = JSON.parse(localStorage.getItem('lifts_logs') || '{}'); } catch(e) { logs = {}; }
  try { customExercises = JSON.parse(localStorage.getItem('lifts_custom') || '{}'); } catch(e) { customExercises = {}; }
}
function save() {
  try { localStorage.setItem('lifts_logs', JSON.stringify(logs)); } catch(e) {}
}
function saveCustom() {
  try { localStorage.setItem('lifts_custom', JSON.stringify(customExercises)); } catch(e) {}
}

function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-');
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1] + ' ' + +day;
}
function logKey(ex, date) { return ex + '__' + date; }
function getHistory(ex) {
  return Object.keys(logs)
    .filter(k => k.startsWith(ex + '__'))
    .map(k => ({ date: k.split('__')[1], sets: logs[k] }))
    .sort((a,b) => b.date.localeCompare(a.date));
}
function getLastEntry(ex) { const h = getHistory(ex); return h[0] || null; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0,0);
}

function goHome() { renderHome(); showScreen('home'); }

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Morning.';
  if (h < 17) return 'Afternoon.';
  return 'Evening.';
}

function renderHome() {
  document.getElementById('nav-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  document.getElementById('greeting').textContent = getGreeting();

  const todayKey = today();
  const todayLogs = Object.keys(logs).filter(k => k.endsWith('__' + todayKey));
  document.getElementById('home-sub').textContent = todayLogs.length > 0
    ? `${todayLogs.length} exercise${todayLogs.length !== 1 ? 's' : ''} logged today`
    : 'Pick a muscle group to get started.';

  const grid = document.getElementById('muscle-grid');
  grid.innerHTML = MUSCLES.map(m => {
    const allEx = getExercisesForMuscle(m.id);
    const logged = allEx.filter(ex => getLastEntry(ex)).length;
    return `<div class="muscle-card" onclick="openMuscle('${m.id}')">
      <span class="muscle-emoji">${m.emoji}</span>
      <div class="muscle-name">${m.name}</div>
      <div class="muscle-tag">${m.tag}</div>
      ${logged > 0 ? `<div class="muscle-count">${logged}</div>` : ''}
    </div>`;
  }).join('');

  const allRecent = [];
  const seen = new Set();
  Object.keys(logs)
    .map(k => ({ ex: k.split('__')[0], date: k.split('__')[1], sets: logs[k] }))
    .sort((a,b) => b.date.localeCompare(a.date))
    .forEach(r => { if (!seen.has(r.ex) && allRecent.length < 5) { seen.add(r.ex); allRecent.push(r); } });

  const sec = document.getElementById('recent-section');
  if (!allRecent.length) { sec.innerHTML = ''; return; }
  const muscle = ex => MUSCLES.find(m => getExercisesForMuscle(m.id).includes(ex));
  sec.innerHTML = `<div class="section-label" style="margin-top:8px">Recent</div><div class="recent-list">`
    + allRecent.map(r => {
        const best = r.sets.reduce((mx,s) => Math.max(mx, parseFloat(s.weight)||0), 0);
        const m = muscle(r.ex);
        return `<div class="recent-card" onclick="openExerciseDirect('${r.ex}','${m?m.id:''}')">
          <div>
            <div class="recent-name">${r.ex}</div>
            <div class="recent-meta">${fmtDate(r.date)} · ${r.sets.length} sets · top ${best} lbs</div>
          </div>
          <span class="recent-arrow">›</span>
        </div>`;
      }).join('') + '</div>';
}

function getExercisesForMuscle(id) {
  const m = MUSCLES.find(x => x.id === id);
  const custom = customExercises[id] || [];
  return [...(m ? m.exercises : []), ...custom];
}

function openMuscle(id) {
  currentMuscle = MUSCLES.find(m => m.id === id);
  document.getElementById('muscle-screen-title').textContent = currentMuscle.emoji + ' ' + currentMuscle.name;
  renderExerciseList();
  showScreen('exercises');
}

function renderExerciseList() {
  const exs = getExercisesForMuscle(currentMuscle.id);
  document.getElementById('exercise-list').innerHTML = exs.map(ex => {
    const last = getLastEntry(ex);
    const meta = last
      ? `Last: ${fmtDate(last.date)} · ${last.sets.length} set${last.sets.length !== 1 ? 's' : ''}`
      : 'No logs yet';
    return `<div class="ex-card" onclick="openExercise('${ex}')">
      <div>
        <div class="ex-card-name">${ex}</div>
        <div class="ex-card-meta">${meta}</div>
      </div>
      <span class="ex-card-arrow">›</span>
    </div>`;
  }).join('');
}

function openAddExercise() {
  document.getElementById('new-ex-name').value = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('new-ex-name').focus(), 100);
}
function closeAddExercise() {
  document.getElementById('modal-overlay').classList.remove('open');
}
function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) closeAddExercise();
}
function confirmAddExercise() {
  const name = document.getElementById('new-ex-name').value.trim();
  if (!name) { showToast('Enter a name'); return; }
  const id = currentMuscle.id;
  if (!customExercises[id]) customExercises[id] = [];
  if (getExercisesForMuscle(id).map(e => e.toLowerCase()).includes(name.toLowerCase())) {
    showToast('Already exists'); return;
  }
  customExercises[id].push(name);
  saveCustom();
  closeAddExercise();
  renderExerciseList();
  showToast('Exercise added');
}

function openExerciseDirect(ex, muscleId) {
  currentMuscle = MUSCLES.find(m => m.id === muscleId) || null;
  openExercise(ex);
}

function openExercise(ex) {
  currentExercise = ex;
  document.getElementById('log-ex-name').textContent = ex;
  document.getElementById('log-ex-muscle').textContent = (currentMuscle ? currentMuscle.name + ' · ' : '') + 'Log your sets';
  document.getElementById('log-back-btn').onclick = currentMuscle ? () => openMuscle(currentMuscle.id) : goHome;
  document.getElementById('log-date').value = today();
  const existing = logs[logKey(ex, today())];
  sets = existing ? JSON.parse(JSON.stringify(existing)) : [{weight:'',reps:''}];
  renderSets();
  renderHistory();
  // reset AI
  document.getElementById('ai-response').textContent = '';
  document.getElementById('ai-body').classList.remove('open');
  document.getElementById('ai-chevron').classList.remove('open');
  document.getElementById('ai-ask-btn').disabled = false;
  document.getElementById('ai-ask-btn').textContent = '✦ Analyse my progress';
  showScreen('log');
}

function renderSets() {
  document.getElementById('sets-container').innerHTML = sets.map((s,i) => `
    <div class="set-row">
      <div class="set-num">S${i+1}</div>
      <input class="set-input" type="number" inputmode="decimal" min="0" step="2.5" placeholder="0" value="${s.weight}" oninput="sets[${i}].weight=this.value">
      <input class="set-input" type="number" inputmode="numeric" min="0" placeholder="0" value="${s.reps}" oninput="sets[${i}].reps=this.value">
      <button class="set-del" onclick="removeSet(${i})">✕</button>
    </div>`).join('');
}

function addSet() { sets.push({weight:'',reps:''}); renderSets(); }
function removeSet(i) {
  if (sets.length === 1) { showToast('Need at least one set'); return; }
  sets.splice(i,1); renderSets();
}

function saveLog() {
  const date = document.getElementById('log-date').value;
  if (!date) { showToast('Pick a date'); return; }
  const valid = sets.filter(s => s.weight !== '' || s.reps !== '');
  if (!valid.length) { showToast('Add at least one set'); return; }
  logs[logKey(currentExercise, date)] = sets.map(s => ({weight:s.weight, reps:s.reps}));
  save();
  renderHistory();
  showToast('Saved ✓');
}

function renderHistory() {
  const hist = getHistory(currentExercise);
  const area = document.getElementById('history-area');
  if (!hist.length) {
    area.innerHTML = '<div class="empty-state">No history yet.<br>Log your first session above.</div>';
    return;
  }
  area.innerHTML = hist.map((entry, idx) => {
    const prev = hist[idx+1];
    const isToday = entry.date === today();
    const rows = entry.sets.map((s,si) => {
      let badges = '';
      if (prev && prev.sets[si]) {
        const wD = (parseFloat(s.weight)||0) - (parseFloat(prev.sets[si].weight)||0);
        const rD = (parseInt(s.reps)||0) - (parseInt(prev.sets[si].reps)||0);
        if (wD > 0) badges += `<span class="badge badge-up">+${wD}lb</span>`;
        else if (wD < 0) badges += `<span class="badge badge-down">${wD}lb</span>`;
        if (rD > 0) badges += `<span class="badge badge-up">+${rD}r</span>`;
        else if (rD < 0) badges += `<span class="badge badge-down">${rD}r</span>`;
      }
      const wt = s.weight ? s.weight + ' lbs' : '— lbs';
      const rp = s.reps ? s.reps + ' reps' : '— reps';
      return `<div class="hist-row"><span class="hist-set">Set ${si+1}: ${wt} × ${rp}</span><div class="hist-badges">${badges}</div></div>`;
    }).join('');
    return `<div class="hist-card">
      <div class="hist-date">${fmtDate(entry.date)}${isToday ? '<span class="hist-today">Today</span>' : ''}</div>
      ${rows}
    </div>`;
  }).join('');
}

function toggleAI() {
  const body = document.getElementById('ai-body');
  const chev = document.getElementById('ai-chevron');
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

async function askAI() {
  const btn = document.getElementById('ai-ask-btn');
  const resp = document.getElementById('ai-response');
  const hist = getHistory(currentExercise);

  if (!hist.length) {
    resp.textContent = 'Log at least one session first and I can give you personalised advice.';
    resp.classList.remove('loading');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Analysing...';
  resp.classList.add('loading');
  resp.textContent = 'Looking at your data...';

  const summary = hist.slice(0,6).map(h => {
    const topSet = h.sets.reduce((best,s) => {
      const vol = (parseFloat(s.weight)||0) * (parseInt(s.reps)||0);
      return vol > best.vol ? {vol, weight:s.weight, reps:s.reps} : best;
    }, {vol:0, weight:0, reps:0});
    return `${fmtDate(h.date)}: ${h.sets.length} sets, best set ${topSet.weight}lbs × ${topSet.reps} reps`;
  }).join('\n');

  const prompt = `You are a concise, knowledgeable strength coach. The user has logged the following sessions for "${currentExercise}":

${summary}

Analyse their progress and give specific, actionable progressive overload advice for their NEXT session. Be direct and practical. Format with clear recommendations. Keep it under 150 words. Use plain text only, no markdown symbols.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.find(b => b.type === 'text')?.text || 'Could not get a response. Try again.';
    resp.classList.remove('loading');
    resp.textContent = text;
    btn.textContent = '✦ Ask again';
    btn.disabled = false;
  } catch(e) {
    resp.classList.remove('loading');
    resp.textContent = 'Network error. Make sure you have an internet connection and try again.';
    btn.textContent = '✦ Retry';
    btn.disabled = false;
  }
}

load();
renderHome();
</script>
</body>
</html>
