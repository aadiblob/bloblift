<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lifts">
<title>Lifts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --bg: #0e0e10;
  --surface: #18181b;
  --surface2: #222226;
  --surface3: #2a2a2f;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f4f4f5;
  --text2: #a1a1aa;
  --text3: #52525b;
  --accent: #c8f135;
  --accent-dim: rgba(200,241,53,0.12);
  --accent-text: #0e0e10;
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.12);
  --green: #c8f135;
  --green-dim: rgba(200,241,53,0.1);
  --radius: 16px;
  --radius-sm: 10px;
  --font-display: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font-body);color:var(--text);font-size:15px}
#app{height:100vh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;display:none;flex-direction:column;padding-bottom:2.5rem;-webkit-overflow-scrolling:touch}
.screen.active{display:flex}

/* NAV */
.nav{padding:env(safe-area-inset-top,14px) 20px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--bg)}
.nav-title{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-0.3px}
.nav-back{display:flex;align-items:center;gap:5px;color:var(--accent);font-size:14px;font-weight:500;background:none;border:none;cursor:pointer;padding:4px 0;font-family:var(--font-body)}

/* HOME */
.home-header{padding:4px 20px 20px}
.home-greeting{font-family:var(--font-display);font-size:32px;font-weight:800;letter-spacing:-0.8px;line-height:1.1}
.home-sub{font-size:13px;color:var(--text2);margin-top:5px}
.section-label{font-size:11px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--text3);padding:0 20px;margin-bottom:12px}
.muscle-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 20px;margin-bottom:24px}

/* MUSCLE CARDS */
.muscle-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px 16px;cursor:pointer;transition:background 0.15s,border-color 0.15s;position:relative;overflow:hidden;-webkit-user-select:none;display:flex;flex-direction:column;gap:6px}
.muscle-card:active{background:var(--surface2);border-color:var(--border2)}
.muscle-card-icon{font-size:30px;color:var(--text2);margin-bottom:2px}
.muscle-card-name{font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-0.3px;line-height:1}
.muscle-card-tag{font-size:11px;color:var(--text3);font-weight:500}
.muscle-count{position:absolute;top:12px;right:12px;background:var(--accent-dim);color:var(--accent);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:0.03em}

/* AI COACH CARD (special full-width) */


/* RECENT */
.recent-list{padding:0 20px}
.recent-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background 0.15s}
.recent-card:active{background:var(--surface2)}
.recent-name{font-family:var(--font-display);font-size:14px;font-weight:600}
.recent-meta{font-size:12px;color:var(--text2);margin-top:2px}

/* EXERCISE LIST */
.ex-list{padding:0 20px}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background 0.15s}
.ex-card:active{background:var(--surface2)}
.ex-card-name{font-family:var(--font-display);font-size:15px;font-weight:700}
.ex-card-meta{font-size:12px;color:var(--text2);margin-top:2px}
.add-ex-btn{margin:4px 20px 0;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius);padding:14px 16px;width:calc(100% - 40px);display:flex;align-items:center;gap:10px;color:var(--text2);font-size:14px;cursor:pointer;font-family:var(--font-body)}
.add-ex-btn:active{background:var(--surface2)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:24px 20px calc(env(safe-area-inset-bottom,16px) + 16px);width:100%;max-width:430px}
.modal-title{font-family:var(--font-display);font-size:17px;font-weight:700;margin-bottom:16px}
.modal input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:15px;font-family:var(--font-body);outline:none;margin-bottom:12px}
.modal input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-display);border:none;letter-spacing:0.01em}
.btn-primary{background:var(--accent);color:var(--accent-text)}
.btn-primary:active{opacity:0.85}
.btn-secondary{background:var(--surface2);color:var(--text2)}
.btn-secondary:active{opacity:0.7}

/* LOG SCREEN */
.log-header{padding:0 20px 16px}
.log-ex-name{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-0.4px}
.log-muscle{font-size:13px;color:var(--text2);margin-top:3px}
.date-row{padding:0 20px 20px;display:flex;align-items:center;gap:10px}
.date-row label{font-size:13px;color:var(--text2);flex-shrink:0}
.date-row input[type=date]{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:14px;font-family:var(--font-body);outline:none;flex:1}
.date-row input[type=date]:focus{border-color:var(--accent)}
.col-labels{display:grid;grid-template-columns:36px 1fr 1fr 32px;gap:8px;padding:0 20px;margin-bottom:6px}
.col-lbl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:0.05em;text-transform:uppercase;text-align:center}
.sets-list{padding:0 20px}
.set-row{display:grid;grid-template-columns:36px 1fr 1fr 32px;gap:8px;align-items:center;margin-bottom:8px}
.set-num{font-size:12px;color:var(--text3);text-align:center;font-weight:600}
.set-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;color:var(--text);font-size:15px;font-family:var(--font-body);text-align:center;outline:none;width:100%}
.set-input:focus{border-color:var(--accent)}
.set-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;padding:4px}
.set-del:active{color:var(--red)}
.action-row{display:flex;gap:10px;padding:12px 20px 20px}
.add-set-btn{flex:1;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius-sm);padding:11px;font-size:14px;color:var(--text2);cursor:pointer;font-family:var(--font-body);display:flex;align-items:center;justify-content:center;gap:6px}
.save-btn{flex:2;background:var(--accent);border:none;border-radius:var(--radius-sm);padding:11px;font-size:14px;font-weight:700;color:var(--accent-text);cursor:pointer;font-family:var(--font-display);display:flex;align-items:center;justify-content:center;gap:6px}
.save-btn:active{opacity:0.85}

/* HISTORY */
.history-wrap{padding:0 20px}
.hist-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px}
.hist-date{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.hist-today{background:var(--accent-dim);color:var(--accent);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:0.04em;text-transform:uppercase}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-set{font-size:13px;color:var(--text)}
.hist-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.badge-up{background:var(--green-dim);color:var(--green)}
.badge-down{background:var(--red-dim);color:var(--red)}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:14px;line-height:1.6}

/* AI COACH SCREEN */
.ai-screen-header{padding:0 20px 20px}
.ai-screen-title{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-0.4px;color:var(--accent)}
.ai-screen-sub{font-size:13px;color:var(--text2);margin-top:4px}
.ai-ex-picker{padding:0 20px 16px}
.ai-ex-picker label{font-size:12px;color:var(--text2);font-weight:500;display:block;margin-bottom:8px}
.ai-select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-size:14px;font-family:var(--font-body);outline:none;appearance:none;-webkit-appearance:none}
.ai-select:focus{border-color:var(--accent)}
.chart-box{margin:0 20px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;min-height:180px}
.chart-title{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:12px}
canvas#progressChart{width:100%!important}
.ai-analyse-btn{margin:0 20px 16px;background:var(--accent-dim);border:1px solid rgba(200,241,53,0.2);border-radius:var(--radius-sm);padding:13px;width:calc(100% - 40px);font-size:14px;font-weight:700;color:var(--accent);cursor:pointer;font-family:var(--font-display);display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:0.01em}
.ai-analyse-btn:active{opacity:0.8}
.ai-analyse-btn:disabled{opacity:0.4;cursor:default}
.ai-response-box{margin:0 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.ai-response-text{font-size:13px;line-height:1.7;color:var(--text2);white-space:pre-wrap}
.ai-response-text.loading{color:var(--text3)}

/* TOAST */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,16px) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:9px 18px;border-radius:30px;opacity:0;transition:all 0.25s;pointer-events:none;z-index:200;white-space:nowrap;font-family:var(--font-display)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="nav">
      <div class="nav-title">Lifts</div>
      <div style="font-size:12px;color:var(--text3)" id="nav-date"></div>
    </div>
    <div class="home-header">
      <div class="home-greeting" id="greeting"></div>
      <div class="home-sub" id="home-sub"></div>
    </div>
    <div class="section-label">Muscle groups</div>
    <div class="muscle-grid" id="muscle-grid"></div>
    <div id="recent-section"></div>
  </div>

  <!-- EXERCISE LIST -->
  <div class="screen" id="screen-exercises">
    <div class="nav">
      <button class="nav-back" onclick="goHome()"><i class="ti ti-arrow-left"></i> Home</button>
      <div class="nav-title" id="muscle-screen-title"></div>
      <div style="width:60px"></div>
    </div>
    <div class="ex-list" id="exercise-list"></div>
    <button class="add-ex-btn" onclick="openAddExercise()">
      <i class="ti ti-plus" style="font-size:18px"></i> Add custom exercise
    </button>
  </div>

  <!-- LOG SCREEN -->
  <div class="screen" id="screen-log">
    <div class="nav">
      <button class="nav-back" id="log-back-btn"><i class="ti ti-arrow-left"></i> <span id="log-back-label">Back</span></button>
      <div style="width:60px"></div>
    </div>
    <div class="log-header">
      <div class="log-ex-name" id="log-ex-name"></div>
      <div class="log-muscle" id="log-ex-muscle"></div>
    </div>
    <div class="date-row">
      <label>Date</label>
      <input type="date" id="log-date">
    </div>
    <div class="col-labels">
      <div class="col-lbl"></div>
      <div class="col-lbl">Weight</div>
      <div class="col-lbl">Reps</div>
      <div class="col-lbl"></div>
    </div>
    <div class="sets-list" id="sets-container"></div>
    <div class="action-row">
      <button class="add-set-btn" onclick="addSet()"><i class="ti ti-plus"></i> Set</button>
      <button class="save-btn" onclick="saveLog()"><i class="ti ti-check"></i> Save</button>
    </div>
    <div style="padding:0 20px 12px" class="section-label">History</div>
    <div class="history-wrap" id="history-area"></div>
  </div>

  <!-- AI COACH SCREEN -->
  <div class="screen" id="screen-ai">
    <div class="nav">
      <button class="nav-back" onclick="goHome()"><i class="ti ti-arrow-left"></i> Home</button>
      <div class="nav-title">AI Coach</div>
      <div style="width:60px"></div>
    </div>
    <div class="ai-screen-header">
      <div class="ai-screen-title">Your progress</div>
      <div class="ai-screen-sub">Pick an exercise to see your chart and get advice.</div>
    </div>
    <div class="ai-ex-picker">
      <label>Exercise</label>
      <select class="ai-select" id="ai-ex-select" onchange="onAIExerciseChange()"></select>
    </div>
    <div class="chart-box" id="chart-box">
      <div class="chart-title">Top set weight over time</div>
      <canvas id="progressChart" height="140"></canvas>
      <div class="empty-state" id="chart-empty" style="display:none;padding:1.5rem 0">No data yet for this exercise.</div>
    </div>
    <button class="ai-analyse-btn" id="ai-analyse-btn" onclick="askAI()">
      <i class="ti ti-sparkles"></i> Analyse my progress
    </button>
    <div class="ai-response-box" id="ai-response-box" style="display:none">
      <div class="ai-response-text" id="ai-response-text"></div>
    </div>
  </div>

  <!-- ADD EXERCISE MODAL -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-title">Add exercise</div>
      <input type="text" id="new-ex-name" placeholder="e.g. Hack Squat" maxlength="50">
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeAddExercise()">Cancel</button>
        <button class="btn btn-primary" onclick="confirmAddExercise()">Add</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
const MUSCLES = [
  {id:'chest',name:'Chest',icon:'ti-lungs',tag:'Push',exercises:['Bench Press','Incline Bench Press','Dumbbell Fly','Cable Fly','Chest Dip','Push-Up']},
  {id:'back',name:'Back',icon:'ti-yoga',tag:'Pull',exercises:['Deadlift','Pull-Up','Barbell Row','Seated Cable Row','Lat Pulldown','Single-Arm Row']},
  {id:'shoulders',name:'Shoulders',icon:'ti-arrow-autofit-width',tag:'Push',exercises:['Overhead Press','Lateral Raise','Front Raise','Face Pull','Arnold Press','Shrug']},
  {id:'legs',name:'Legs',icon:'ti-run',tag:'Lower',exercises:['Squat','Romanian Deadlift','Leg Press','Leg Curl','Leg Extension','Hip Thrust','Calf Raise','Glute Bridge','Bulgarian Split Squat','Sumo Deadlift','Abductor Machine','Cable Kickback']},
  {id:'biceps',name:'Biceps',icon:'ti-align-center',tag:'Pull',exercises:['Barbell Curl','Dumbbell Curl','Hammer Curl','Preacher Curl','Cable Curl','Incline Curl']},
  {id:'triceps',name:'Triceps',icon:'ti-triangle',tag:'Push',exercises:['Skull Crusher','Tricep Pushdown','Overhead Tricep Extension','Close-Grip Bench','Dip','Kickback']},
  {id:'core',name:'Core',icon:'ti-circle-letter-c',tag:'Accessory',exercises:['Plank','Cable Crunch','Hanging Leg Raise','Ab Wheel','Russian Twist','Side Plank']},
];

let currentMuscle = null;
let currentExercise = null;
let sets = [];
let logs = {};
let customExercises = {};
let progressChart = null;

function load() {
  try { logs = JSON.parse(localStorage.getItem('lifts_logs') || '{}'); } catch(e) { logs = {}; }
  try { customExercises = JSON.parse(localStorage.getItem('lifts_custom') || '{}'); } catch(e) { customExercises = {}; }
}
function save() { try { localStorage.setItem('lifts_logs', JSON.stringify(logs)); } catch(e) {} }
function saveCustom() { try { localStorage.setItem('lifts_custom', JSON.stringify(customExercises)); } catch(e) {} }

function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-');
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1] + ' ' + +day;
}
function logKey(ex, date) { return ex + '__' + date; }
function getHistory(ex) {
  return Object.keys(logs)
    .filter(k => k.startsWith(ex + '__'))
    .map(k => ({ date: k.split('__')[1], sets: logs[k] }))
    .sort((a,b) => b.date.localeCompare(a.date));
}
function getLastEntry(ex) { const h = getHistory(ex); return h[0] || null; }
function getAllExercises() {
  const all = new Set();
  MUSCLES.forEach(m => getExercisesForMuscle(m.id).forEach(e => all.add(e)));
  return [...all].sort();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  if (id === 'ai') renderAIScreen();
}
function goHome() { renderHome(); showScreen('home'); }

function renderHome() {
  document.getElementById('nav-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const h = new Date().getHours();
  document.getElementById('greeting').textContent = h < 12 ? 'Morning.' : h < 17 ? 'Afternoon.' : 'Evening.';
  const todayLogs = Object.keys(logs).filter(k => k.endsWith('__' + today()));
  document.getElementById('home-sub').textContent = todayLogs.length > 0
    ? `${todayLogs.length} exercise${todayLogs.length !== 1 ? 's' : ''} logged today`
    : 'Pick a muscle group to get started.';

  const muscleCards = MUSCLES.map(m => {
    const logged = getExercisesForMuscle(m.id).filter(ex => getLastEntry(ex)).length;
    return `<div class="muscle-card" onclick="openMuscle('${m.id}')">
      <i class="ti ${m.icon} muscle-card-icon"></i>
      <div class="muscle-card-name">${m.name}</div>
      <div class="muscle-card-tag">${m.tag}</div>
      ${logged > 0 ? `<div class="muscle-count">${logged} logged</div>` : ''}
    </div>`;
  });
  muscleCards.push(`<div class="muscle-card" onclick="showScreen('ai')" style="background:linear-gradient(135deg,#1a1f12 0%,#141810 100%);border-color:rgba(200,241,53,0.22)">
    <i class="ti ti-sparkles muscle-card-icon" style="color:var(--accent)"></i>
    <div class="muscle-card-name" style="color:var(--accent)">AI Coach</div>
    <div class="muscle-card-tag">Progress & advice</div>
  </div>`);
  document.getElementById('muscle-grid').innerHTML = muscleCards.join('');

  const allRecent = [];
  const seen = new Set();
  Object.keys(logs)
    .map(k => ({ ex: k.split('__')[0], date: k.split('__')[1], sets: logs[k] }))
    .sort((a,b) => b.date.localeCompare(a.date))
    .forEach(r => { if (!seen.has(r.ex) && allRecent.length < 5) { seen.add(r.ex); allRecent.push(r); } });

  const sec = document.getElementById('recent-section');
  if (!allRecent.length) { sec.innerHTML = ''; return; }
  const findMuscle = ex => MUSCLES.find(m => getExercisesForMuscle(m.id).includes(ex));
  sec.innerHTML = `<div class="section-label" style="margin-top:4px">Recent</div><div class="recent-list">`
    + allRecent.map(r => {
        const best = r.sets.reduce((mx,s) => Math.max(mx, parseFloat(s.weight)||0), 0);
        const m = findMuscle(r.ex);
        return `<div class="recent-card" onclick="openExerciseDirect('${r.ex}','${m?m.id:''}')">
          <div>
            <div class="recent-name">${r.ex}</div>
            <div class="recent-meta">${fmtDate(r.date)} · ${r.sets.length} sets · top ${best} lbs</div>
          </div>
          <i class="ti ti-chevron-right" style="color:var(--text3);font-size:18px"></i>
        </div>`;
      }).join('') + '</div>';
}

function getExercisesForMuscle(id) {
  const m = MUSCLES.find(x => x.id === id);
  return [...(m ? m.exercises : []), ...(customExercises[id] || [])];
}

function openMuscle(id) {
  currentMuscle = MUSCLES.find(m => m.id === id);
  document.getElementById('muscle-screen-title').textContent = currentMuscle.name;
  renderExerciseList();
  showScreen('exercises');
}

function renderExerciseList() {
  document.getElementById('exercise-list').innerHTML = getExercisesForMuscle(currentMuscle.id).map(ex => {
    const last = getLastEntry(ex);
    const meta = last ? `Last: ${fmtDate(last.date)} · ${last.sets.length} set${last.sets.length!==1?'s':''}` : 'No logs yet';
    return `<div class="ex-card" onclick="openExercise('${ex}')">
      <div>
        <div class="ex-card-name">${ex}</div>
        <div class="ex-card-meta">${meta}</div>
      </div>
      <i class="ti ti-chevron-right" style="color:var(--text3);font-size:18px"></i>
    </div>`;
  }).join('');
}

function openAddExercise() {
  document.getElementById('new-ex-name').value = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('new-ex-name').focus(), 100);
}
function closeAddExercise() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModal(e) { if (e.target === document.getElementById('modal-overlay')) closeAddExercise(); }
function confirmAddExercise() {
  const name = document.getElementById('new-ex-name').value.trim();
  if (!name) { showToast('Enter a name'); return; }
  const id = currentMuscle.id;
  if (!customExercises[id]) customExercises[id] = [];
  if (getExercisesForMuscle(id).map(e => e.toLowerCase()).includes(name.toLowerCase())) { showToast('Already exists'); return; }
  customExercises[id].push(name);
  saveCustom();
  closeAddExercise();
  renderExerciseList();
  showToast('Exercise added');
}

function openExerciseDirect(ex, muscleId) {
  currentMuscle = MUSCLES.find(m => m.id === muscleId) || null;
  openExercise(ex);
}

function openExercise(ex) {
  currentExercise = ex;
  document.getElementById('log-ex-name').textContent = ex;
  document.getElementById('log-ex-muscle').textContent = (currentMuscle ? currentMuscle.name + ' · ' : '') + 'Log your sets';
  document.getElementById('log-back-label').textContent = currentMuscle ? currentMuscle.name : 'Back';
  document.getElementById('log-back-btn').onclick = currentMuscle ? () => openMuscle(currentMuscle.id) : goHome;
  document.getElementById('log-date').value = today();
  const existing = logs[logKey(ex, today())];
  sets = existing ? JSON.parse(JSON.stringify(existing)) : [{weight:'',reps:''}];
  renderSets();
  renderHistory();
  showScreen('log');
}

function renderSets() {
  document.getElementById('sets-container').innerHTML = sets.map((s,i) => `
    <div class="set-row">
      <div class="set-num">S${i+1}</div>
      <input class="set-input" type="number" inputmode="decimal" min="0" step="2.5" placeholder="0" value="${s.weight}" oninput="sets[${i}].weight=this.value">
      <input class="set-input" type="number" inputmode="numeric" min="0" placeholder="0" value="${s.reps}" oninput="sets[${i}].reps=this.value">
      <button class="set-del" onclick="removeSet(${i})"><i class="ti ti-x"></i></button>
    </div>`).join('');
}

function addSet() { sets.push({weight:'',reps:''}); renderSets(); }
function removeSet(i) {
  if (sets.length === 1) { showToast('Need at least one set'); return; }
  sets.splice(i,1); renderSets();
}

function saveLog() {
  const date = document.getElementById('log-date').value;
  if (!date) { showToast('Pick a date'); return; }
  if (!sets.filter(s => s.weight !== '' || s.reps !== '').length) { showToast('Add at least one set'); return; }
  logs[logKey(currentExercise, date)] = sets.map(s => ({weight:s.weight, reps:s.reps}));
  save();
  renderHistory();
  showToast('Saved ✓');
}

function renderHistory() {
  const hist = getHistory(currentExercise);
  const area = document.getElementById('history-area');
  if (!hist.length) { area.innerHTML = '<div class="empty-state">No history yet.<br>Log your first session above.</div>'; return; }
  area.innerHTML = hist.map((entry, idx) => {
    const prev = hist[idx+1];
    const isToday = entry.date === today();
    const rows = entry.sets.map((s,si) => {
      let badges = '';
      if (prev && prev.sets[si]) {
        const wD = (parseFloat(s.weight)||0) - (parseFloat(prev.sets[si].weight)||0);
        const rD = (parseInt(s.reps)||0) - (parseInt(prev.sets[si].reps)||0);
        if (wD > 0) badges += `<span class="badge badge-up">+${wD}lb</span>`;
        else if (wD < 0) badges += `<span class="badge badge-down">${wD}lb</span>`;
        if (rD > 0) badges += `<span class="badge badge-up">+${rD}r</span>`;
        else if (rD < 0) badges += `<span class="badge badge-down">${rD}r</span>`;
      }
      return `<div class="hist-row"><span class="hist-set">Set ${si+1}: ${s.weight||'—'} lbs × ${s.reps||'—'} reps</span><div class="hist-badges">${badges}</div></div>`;
    }).join('');
    return `<div class="hist-card"><div class="hist-date">${fmtDate(entry.date)}${isToday?'<span class="hist-today">Today</span>':''}</div>${rows}</div>`;
  }).join('');
}

/* AI COACH SCREEN */
function renderAIScreen() {
  const select = document.getElementById('ai-ex-select');
  const allEx = getAllExercises().filter(ex => getHistory(ex).length > 0);
  if (!allEx.length) {
    select.innerHTML = '<option>No exercises logged yet</option>';
  } else {
    select.innerHTML = allEx.map(ex => `<option value="${ex}">${ex}</option>`).join('');
  }
  document.getElementById('ai-response-box').style.display = 'none';
  document.getElementById('ai-response-text').textContent = '';
  document.getElementById('ai-analyse-btn').disabled = false;
  document.getElementById('ai-analyse-btn').innerHTML = '<i class="ti ti-sparkles"></i> Analyse my progress';
  renderChart(select.value);
}

function onAIExerciseChange() {
  const ex = document.getElementById('ai-ex-select').value;
  document.getElementById('ai-response-box').style.display = 'none';
  document.getElementById('ai-analyse-btn').disabled = false;
  document.getElementById('ai-analyse-btn').innerHTML = '<i class="ti ti-sparkles"></i> Analyse my progress';
  renderChart(ex);
}

function renderChart(ex) {
  const hist = getHistory(ex).reverse();
  const canvas = document.getElementById('progressChart');
  const empty = document.getElementById('chart-empty');

  if (progressChart) { progressChart.destroy(); progressChart = null; }

  if (!hist.length || !ex) {
    canvas.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  canvas.style.display = 'block';
  empty.style.display = 'none';

  const labels = hist.map(h => fmtDate(h.date));
  const data = hist.map(h => {
    return Math.max(...h.sets.map(s => parseFloat(s.weight)||0));
  });

  progressChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data,
        borderColor: '#c8f135',
        borderWidth: 2,
        pointBackgroundColor: '#c8f135',
        pointRadius: 4,
        pointHoverRadius: 6,
        fill: true,
        backgroundColor: 'rgba(200,241,53,0.07)',
        tension: 0.35
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false }, tooltip: {
        backgroundColor: '#222226',
        titleColor: '#f4f4f5',
        bodyColor: '#a1a1aa',
        borderColor: 'rgba(255,255,255,0.1)',
        borderWidth: 1,
        callbacks: { label: ctx => ctx.parsed.y + ' lbs' }
      }},
      scales: {
        x: { ticks: { color: '#52525b', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: { ticks: { color: '#52525b', font: { size: 11 }, callback: v => v + ' lb' }, grid: { color: 'rgba(255,255,255,0.04)' } }
      }
    }
  });
}

async function askAI() {
  const ex = document.getElementById('ai-ex-select').value;
  const btn = document.getElementById('ai-analyse-btn');
  const box = document.getElementById('ai-response-box');
  const resp = document.getElementById('ai-response-text');
  const hist = getHistory(ex);

  if (!hist.length) { showToast('No data for this exercise yet'); return; }

  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader"></i> Analysing...';
  box.style.display = 'block';
  resp.classList.add('loading');
  resp.textContent = 'Reviewing your data...';

  const summary = hist.slice(0,8).map(h => {
    const top = h.sets.reduce((b,s) => {
      const v = (parseFloat(s.weight)||0) * (parseInt(s.reps)||0);
      return v > b.vol ? {vol:v, weight:s.weight, reps:s.reps} : b;
    }, {vol:0,weight:0,reps:0});
    return `${fmtDate(h.date)}: ${h.sets.length} sets, top set ${top.weight}lbs × ${top.reps} reps`;
  }).join('\n');

  const prompt = `You are a concise, no-fluff strength coach. The athlete logged the following sessions for "${ex}":

${summary}

Analyse their trend and give specific, actionable advice for their next session to continue progressive overload. Be direct. Under 160 words. Plain text only, no markdown or symbols.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await res.json();
    const text = data.content?.find(b => b.type === 'text')?.text || 'No response. Try again.';
    resp.classList.remove('loading');
    resp.textContent = text;
    btn.innerHTML = '<i class="ti ti-refresh"></i> Ask again';
    btn.disabled = false;
  } catch(e) {
    resp.classList.remove('loading');
    resp.textContent = 'Network error. Check your connection and try again.';
    btn.innerHTML = '<i class="ti ti-sparkles"></i> Retry';
    btn.disabled = false;
  }
}

load();
renderHome();
</script>
