<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bloblift">
<title>bloblift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --bg:#0e0e10;--surface:#18181b;--surface2:#222226;--surface3:#2a2a2f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f4f4f5;--text2:#a1a1aa;--text3:#52525b;
  --accent:#c8f135;--accent-dim:rgba(200,241,53,0.12);--accent-text:#0e0e10;
  --red:#f87171;--red-dim:rgba(248,113,113,0.12);
  --radius:16px;--radius-sm:10px;
  --font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font-body);color:var(--text);font-size:15px}
#app{height:100vh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;overflow:hidden}

/* SCREENS */
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg)}
.screen.active{display:flex}

/* NAV */
.nav{padding:env(safe-area-inset-top,14px) 20px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--bg);z-index:10}
.nav-title{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px}
.nav-back{display:flex;align-items:center;gap:5px;color:var(--accent);font-size:14px;font-weight:500;background:none;border:none;cursor:pointer;padding:4px 0;font-family:var(--font-body)}

/* HOME 3D SCREEN */
#screen-home{background:var(--bg)}
.home-top{padding:env(safe-area-inset-top,14px) 20px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10;position:relative}
.home-brand{font-family:var(--font-display);font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.home-brand img{width:26px;height:26px;object-fit:contain}
.home-hint{font-size:11px;color:var(--text3);text-align:center;padding:6px 0 0;z-index:10;position:relative;letter-spacing:0.03em}

/* 3D CANVAS CONTAINER */
#canvas-wrap{flex:1;position:relative;min-height:0}
#three-canvas{width:100%;height:100%;display:block;touch-action:none}

/* MUSCLE LABELS */
.muscle-label{position:absolute;pointer-events:none;opacity:0;transition:opacity 0.2s;z-index:5}
.muscle-label.visible{pointer-events:auto;opacity:1}
.label-box{background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:6px 12px;font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap;transition:background 0.15s,border-color 0.15s,color 0.15s}
.label-box:hover,.label-box.hovered{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.label-line{position:absolute;pointer-events:none}
svg.label-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}

/* AI FAB */
.ai-fab{position:absolute;bottom:calc(env(safe-area-inset-bottom,16px) + 16px);right:20px;width:52px;height:52px;border-radius:50%;background:#000;border:2px solid rgba(200,241,53,0.4);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:20;box-shadow:0 0 20px rgba(200,241,53,0.25);padding:0;overflow:hidden}
.ai-fab:active{transform:scale(0.93)}

/* EXERCISE LIST SCREEN */
.ex-list{padding:0 20px}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background 0.15s}
.ex-card:active{background:var(--surface2)}
.ex-card-name{font-family:var(--font-display);font-size:15px;font-weight:700}
.ex-card-meta{font-size:12px;color:var(--text2);margin-top:2px}
.add-ex-btn{margin:4px 20px 0;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius);padding:14px 16px;width:calc(100% - 40px);display:flex;align-items:center;gap:10px;color:var(--text2);font-size:14px;cursor:pointer;font-family:var(--font-body)}
.add-ex-btn:active{background:var(--surface2)}

/* LOG SCREEN */
.log-header{padding:0 20px 16px}
.log-ex-name{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-0.4px}
.log-muscle{font-size:13px;color:var(--text2);margin-top:3px}
.date-row{padding:0 20px 20px;display:flex;align-items:center;gap:10px}
.date-row label{font-size:13px;color:var(--text2);flex-shrink:0}
.date-row input[type=date]{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:14px;font-family:var(--font-body);outline:none;flex:1}
.date-row input[type=date]:focus{border-color:var(--accent)}
.col-labels{display:grid;grid-template-columns:36px 1fr 1fr 32px;gap:8px;padding:0 20px;margin-bottom:6px}
.col-lbl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:0.05em;text-lowercase:lowercase;text-align:center}
.sets-list{padding:0 20px}
.set-row{display:grid;grid-template-columns:36px 1fr 1fr 32px;gap:8px;align-items:center;margin-bottom:8px}
.set-num{font-size:12px;color:var(--text3);text-align:center;font-weight:600}
.set-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;color:var(--text);font-size:15px;font-family:var(--font-body);text-align:center;outline:none;width:100%}
.set-input:focus{border-color:var(--accent)}
.set-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;padding:4px}
.set-del:active{color:var(--red)}
.action-row{display:flex;gap:10px;padding:12px 20px 20px}
.add-set-btn{flex:1;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius-sm);padding:11px;font-size:14px;color:var(--text2);cursor:pointer;font-family:var(--font-body);display:flex;align-items:center;justify-content:center;gap:6px}
.save-btn{flex:2;background:var(--accent);border:none;border-radius:var(--radius-sm);padding:11px;font-size:14px;font-weight:700;color:var(--accent-text);cursor:pointer;font-family:var(--font-display);display:flex;align-items:center;justify-content:center;gap:6px}
.save-btn:active{opacity:0.85}
.section-label{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:lowercase;color:var(--text3);padding:0 20px;margin-bottom:10px}

/* HISTORY */
.history-wrap{padding:0 20px}
.hist-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px}
.hist-date{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.hist-today{background:var(--accent-dim);color:var(--accent);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:lowercase}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-set{font-size:13px}
.hist-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.badge-up{background:rgba(200,241,53,0.1);color:#c8f135}
.badge-down{background:var(--red-dim);color:var(--red)}
.empty-state{text-align:center;padding:2rem 1rem;color:var(--text3);font-size:14px;line-height:1.6}

/* AI SCREEN */
.ai-screen-header{padding:0 20px 16px}
.ai-screen-title{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-0.4px;color:var(--accent)}
.ai-screen-sub{font-size:13px;color:var(--text2);margin-top:4px}
.ai-ex-picker{padding:0 20px 16px}
.ai-ex-picker label{font-size:12px;color:var(--text2);font-weight:500;display:block;margin-bottom:8px}
.ai-select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-size:14px;font-family:var(--font-body);outline:none;appearance:none;-webkit-appearance:none}
.ai-select:focus{border-color:var(--accent)}
.chart-box{margin:0 20px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-height:180px}
.chart-title{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:0.06em;text-transform:lowercase;margin-bottom:12px}
.ai-analyse-btn{margin:0 20px 16px;background:var(--accent-dim);border:1px solid rgba(200,241,53,0.2);border-radius:var(--radius-sm);padding:13px;width:calc(100% - 40px);font-size:14px;font-weight:700;color:var(--accent);cursor:pointer;font-family:var(--font-display);display:flex;align-items:center;justify-content:center;gap:8px}
.ai-analyse-btn:active{opacity:0.8}
.ai-analyse-btn:disabled{opacity:0.4;cursor:default}
.ai-response-box{margin:0 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.ai-response-text{font-size:13px;line-height:1.7;color:var(--text2);white-space:pre-wrap}
.ai-response-text.loading{color:var(--text3)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:24px 20px calc(env(safe-area-inset-bottom,16px)+16px);width:100%;max-width:430px}
.modal-title{font-family:var(--font-display);font-size:17px;font-weight:700;margin-bottom:16px}
.modal input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:15px;font-family:var(--font-body);outline:none;margin-bottom:12px}
.modal input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-display);border:none}
.btn-primary{background:var(--accent);color:var(--accent-text)}
.btn-secondary{background:var(--surface2);color:var(--text2)}

/* TOAST */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,16px)+16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:9px 18px;border-radius:30px;opacity:0;transition:all 0.25s;pointer-events:none;z-index:200;white-space:nowrap;font-family:var(--font-display)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <!-- HOME: 3D MODEL -->
  <div class="screen active" id="screen-home">
    <div class="home-top">
      <div class="home-brand">
        <img src="logo.png" alt="bloblift">
        bloblift
      </div>
      <div style="font-size:12px;color:var(--text3)" id="nav-date"></div>
    </div>
    <div class="home-hint">drag to rotate · tap a muscle to train</div>
    <div id="canvas-wrap">
      <canvas id="three-canvas"></canvas>
      <svg class="label-svg" id="label-svg"></svg>
      <div id="labels-container"></div>
    </div>
    <button class="ai-fab" onclick="showScreen('ai')" title="AI Coach">
      <img src="coach.png" alt="AI Coach" style="width:42px;height:42px;object-fit:cover;border-radius:50%">
    </button>
  </div>

  <!-- EXERCISE LIST -->
  <div class="screen" id="screen-exercises">
    <div class="nav">
      <button class="nav-back" onclick="showScreen('home')"><i class="ti ti-arrow-left"></i> home</button>
      <div class="nav-title" id="muscle-screen-title"></div>
      <div style="width:60px"></div>
    </div>
    <div class="ex-list" id="exercise-list"></div>
    <button class="add-ex-btn" onclick="openAddExercise()">
      <i class="ti ti-plus" style="font-size:18px"></i> add custom exercise
    </button>
    <div style="height:2rem"></div>
  </div>

  <!-- LOG SCREEN -->
  <div class="screen" id="screen-log">
    <div class="nav">
      <button class="nav-back" id="log-back-btn"><i class="ti ti-arrow-left"></i> <span id="log-back-label">back</span></button>
      <div style="width:60px"></div>
    </div>
    <div class="log-header">
      <div class="log-ex-name" id="log-ex-name"></div>
      <div class="log-muscle" id="log-ex-muscle"></div>
    </div>
    <div class="date-row">
      <label>date</label>
      <input type="date" id="log-date">
    </div>
    <div class="col-labels">
      <div class="col-lbl"></div>
      <div class="col-lbl">weight</div>
      <div class="col-lbl">reps</div>
      <div class="col-lbl"></div>
    </div>
    <div class="sets-list" id="sets-container"></div>
    <div class="action-row">
      <button class="add-set-btn" onclick="addSet()"><i class="ti ti-plus"></i> add set</button>
      <button class="save-btn" onclick="saveLog()"><i class="ti ti-check"></i> save</button>
    </div>
    <div class="section-label" style="margin-top:4px">history</div>
    <div class="history-wrap" id="history-area"></div>
    <div style="height:2rem"></div>
  </div>

  <!-- AI SCREEN -->
  <div class="screen" id="screen-ai">
    <div class="nav">
      <button class="nav-back" onclick="showScreen('home')"><i class="ti ti-arrow-left"></i> home</button>
      <div class="nav-title">ai coach</div>
      <div style="width:60px"></div>
    </div>
    <div class="ai-screen-header">
      <div class="ai-screen-title">your progress</div>
      <div class="ai-screen-sub">lets see what you are working with.</div>
    </div>
    <div class="ai-ex-picker">
      <label>exercise</label>
      <select class="ai-select" id="ai-ex-select" onchange="onAIExerciseChange()"></select>
    </div>
    <div class="chart-box" id="chart-box">
      <div class="chart-title">top set weight over time</div>
      <canvas id="progressChart" height="140"></canvas>
      <div class="empty-state" id="chart-empty" style="display:none;padding:1.5rem 0">no data yet. time to make history.</div>
    </div>
    <button class="ai-analyse-btn" id="ai-analyse-btn" onclick="askAI()">
      <i class="ti ti-sparkles"></i> lets see the damage
    </button>
    <div class="ai-response-box" id="ai-response-box" style="display:none">
      <div class="ai-response-text" id="ai-response-text"></div>
    </div>
    <div style="height:2rem"></div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-title">add exercise</div>
      <input type="text" id="new-ex-name" placeholder="e.g. hack squat" maxlength="50">
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeAddExercise()">cancel</button>
        <button class="btn btn-primary" onclick="confirmAddExercise()">add</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
const MUSCLES = [
  {id:'chest',    name:'chest',     icon:'ti-lungs',   exercises:['Bench Press','Incline Bench Press','Dumbbell Fly','Cable Fly','Chest Dip','Push-Up']},
  {id:'back',     name:'back',      icon:'ti-yoga',    exercises:['Deadlift','Pull-Up','Barbell Row','Seated Cable Row','Lat Pulldown','Single-Arm Row']},
  {id:'shoulders',name:'shoulders', icon:'ti-arrows-left-right', exercises:['Overhead Press','Lateral Raise','Front Raise','Face Pull','Arnold Press','Shrug']},
  {id:'legs',     name:'legs',      icon:'ti-run',     exercises:['Squat','Romanian Deadlift','Leg Press','Leg Curl','Leg Extension','Hip Thrust','Calf Raise','Glute Bridge','Bulgarian Split Squat','Sumo Deadlift','Abductor Machine']},
  {id:'biceps',   name:'biceps',    icon:'ti-hand-rock',exercises:['Barbell Curl','Dumbbell Curl','Hammer Curl','Preacher Curl','Cable Curl','Incline Curl']},
  {id:'triceps',  name:'triceps',   icon:'ti-triangle', exercises:['Skull Crusher','Tricep Pushdown','Overhead Extension','Close-Grip Bench','Dip','Kickback']},
  {id:'core',     name:'core',      icon:'ti-circle-letter-c', exercises:['Plank','Cable Crunch','Hanging Leg Raise','Ab Wheel','Russian Twist','Side Plank']},
];

let currentMuscle = null;
let currentExercise = null;
let sets = [];
let logs = {};
let customExercises = {};

function loadData(){
  try{logs=JSON.parse(localStorage.getItem('bloblift_logs')||'{}')}catch(e){logs={}}
  try{customExercises=JSON.parse(localStorage.getItem('bloblift_custom')||'{}')}catch(e){customExercises={}}
}
function saveData(){try{localStorage.setItem('bloblift_logs',JSON.stringify(logs))}catch(e){}}
function saveCustom(){try{localStorage.setItem('bloblift_custom',JSON.stringify(customExercises))}catch(e){}}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){
  if(!d)return'';
  const[y,m,day]=d.split('-');
  return['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][+m-1]+' '+ +day;
}
function logKey(ex,date){return ex+'__'+date}
function getHistory(ex){
  return Object.keys(logs).filter(k=>k.startsWith(ex+'__'))
    .map(k=>({date:k.split('__')[1],sets:logs[k]}))
    .sort((a,b)=>b.date.localeCompare(a.date));
}
function getLastEntry(ex){const h=getHistory(ex);return h[0]||null}
function getAllExercises(){
  const all=new Set();
  MUSCLES.forEach(m=>getExercisesForMuscle(m.id).forEach(e=>all.add(e)));
  return[...all].sort();
}
function getExercisesForMuscle(id){
  const m=MUSCLES.find(x=>x.id===id);
  return[...(m?m.exercises:[]),...(customExercises[id]||[])];
}

// ─── SCREENS ────────────────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  if(id==='ai')renderAIScreen();
  if(id==='home')updateLabelVisibility();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ─── THREE.JS 3D MODEL ───────────────────────────────────────────────────────
let scene,camera,renderer,raycaster,mouse;
let meshMap={};         // muscleId -> THREE.Mesh[]
let labelEls={};        // muscleId -> {el, line}
let hoveredId=null;
let rotY=0,rotX=0.1;
let velY=0,velX=0;
let isDragging=false;
let lastX=0,lastY=0;
let animId=null;

const MAT_DEFAULT = ()=>new THREE.MeshPhongMaterial({color:0x2a2a2f,shininess:40,specular:0x444444});
const MAT_HOVER   = ()=>new THREE.MeshPhongMaterial({color:0x3a4a18,shininess:80,specular:0x88aa22,emissive:0x1a2a08});
const MAT_ACCENT  = ()=>new THREE.MeshPhongMaterial({color:0x8ab520,shininess:120,specular:0xccff44,emissive:0x2a4400});

// Muscle group world positions for label anchors (approximate body coords)
const LABEL_ANCHORS = {
  chest:     {x: 0,    y: 1.05, z: 0.28,  side:'front'},
  shoulders: {x: 0,    y: 1.35, z: 0.1,   side:'front'},
  biceps:    {x: 0.52, y: 0.95, z: 0.05,  side:'front'},
  core:      {x: 0,    y: 0.65, z: 0.28,  side:'front'},
  legs:      {x: 0.18, y: 0.0,  z: 0.12,  side:'front'},
  back:      {x: 0,    y: 1.1,  z:-0.28,  side:'back'},
  triceps:   {x:-0.52, y: 0.95, z:-0.1,   side:'back'},
};

function buildFigure(){
  // HEAD
  addMesh(null, new THREE.SphereGeometry(0.18,12,10), [0,1.72,0]);

  // NECK
  addMesh(null, new THREE.CylinderGeometry(0.08,0.1,0.18,8), [0,1.55,0]);

  // TORSO - trapezoidal chest (wide top narrow waist)
  // Chest - broad upper chest
  addMesh('chest', customTorso(0.44,0.52,0.22,0.28,0.32), [0,1.1,0]);

  // Core / abs - narrower
  addMesh('core', customTorso(0.30,0.36,0.18,0.22,0.38), [0,0.65,0]);

  // SHOULDERS - big deltoid caps
  addMesh('shoulders', new THREE.SphereGeometry(0.16,10,8), [-0.58,1.38,0]);
  addMesh('shoulders', new THREE.SphereGeometry(0.16,10,8), [ 0.58,1.38,0]);
  // trap humps
  addMesh('shoulders', new THREE.SphereGeometry(0.12,8,6),  [-0.28,1.5,0]);
  addMesh('shoulders', new THREE.SphereGeometry(0.12,8,6),  [ 0.28,1.5,0]);

  // BACK - lat slabs

function customTorso(wTop,wBot,dTop,dBot,h){
  // tapered box using BufferGeometry
  const g=new THREE.BoxGeometry(wBot,h,dBot,1,1,1);
  const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const y=pos.getY(i);
    if(y>0){
      pos.setX(i,pos.getX(i)*(wTop/wBot));
      pos.setZ(i,pos.getZ(i)*(dTop/dBot));
    }
  }
  pos.needsUpdate=true;
  g.computeVertexNormals();
  return g;
}

function customLat(side){
  // Lat slab - wide fan shape
  const g=new THREE.CylinderGeometry(0.01,0.16,0.42,6,1,false,
    side<0?Math.PI*0.05:Math.PI*0.55, Math.PI*0.42);
  return g;
}

function brachialMesh(){
  return new THREE.CylinderGeometry(0.085,0.075,0.40,9);
}

function addMesh(muscleId, geo, pos, rotEuler){
  const mat = muscleId ? MAT_DEFAULT() : new THREE.MeshPhongMaterial({color:0x242428,shininess:20});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(pos[0],pos[1],pos[2]);
  if(rotEuler) mesh.rotation.set(rotEuler[0],rotEuler[1],rotEuler[2]);
  mesh.castShadow=true;
  mesh.userData.muscleId = muscleId;
  scene.add(mesh);
  if(muscleId){
    if(!meshMap[muscleId]) meshMap[muscleId]=[];
    meshMap[muscleId].push(mesh);
  }
  return mesh;
}

function project3D(worldX,worldY,worldZ){
  const wrap=document.getElementById('canvas-wrap');
  const W=wrap.clientWidth,H=wrap.clientHeight;
  const vec=new THREE.Vector3(worldX,worldY,worldZ);
  vec.applyEuler(new THREE.Euler(rotX,rotY,0,'XYZ'));
  vec.project(camera);
  return{
    x:(vec.x*0.5+0.5)*W,
    y:(-vec.y*0.5+0.5)*H,
    z:vec.z
  };
}

function updateLabelVisibility(){
  if(!labelEls) return;
  const wrap=document.getElementById('canvas-wrap');
  if(!wrap) return;
  const W=wrap.clientWidth, H=wrap.clientHeight;

  // Which direction is "front"?
  // rotY: 0 = front, PI = back
  const frontFacing = Math.cos(rotY);  // >0 = seeing front, <0 = seeing back
  const sideFacing  = Math.sin(rotY);  // sin tells left/right

  MUSCLES.forEach(m=>{
    const anchor=LABEL_ANCHORS[m.id];
    const {el,box,line}=labelEls[m.id];
    if(!anchor){el.classList.remove('visible');return;}

    // Visibility: show front muscles when facing front, back when facing back
    let visible=false;
    if(anchor.side==='front' && frontFacing > 0.15) visible=true;
    if(anchor.side==='back'  && frontFacing < -0.15) visible=true;
    // Show all when side-on (transition zone)
    if(Math.abs(frontFacing)<0.25) visible=true;

    if(!visible){
      el.classList.remove('visible');
      line.setAttribute('opacity','0');
      return;
    }

    // Project anchor to screen space
    const pt=project3D(anchor.x,anchor.y,anchor.z);
    if(pt.z>1){el.classList.remove('visible');return;}

    el.classList.add('visible');

    // Position label — offset to side to avoid overlapping body
    const LW=90, LH=28;
    // Alternate sides: left muscles go left, right go right, center based on rotation
    let offX = anchor.x < -0.1 ? -LW-18 : anchor.x > 0.1 ? 18 : (sideFacing>0 ? -LW-18 : 18);
    let lx=pt.x+offX;
    let ly=pt.y-LH/2;
    // clamp to canvas
    lx=Math.max(4,Math.min(W-LW-4,lx));
    ly=Math.max(4,Math.min(H-LH-4,ly));

    el.style.left=lx+'px';
    el.style.top=ly+'px';
    el.style.width=LW+'px';

    // Draw connector line from label edge to anchor
    const labelCX = offX > 0 ? lx : lx+LW;
    const labelCY = ly+LH/2;
    line.setAttribute('x1',labelCX);
    line.setAttribute('y1',labelCY);
    line.setAttribute('x2',pt.x);
    line.setAttribute('y2',pt.y);
    line.setAttribute('opacity','1');

    // Highlight if hovered
    if(hoveredId===m.id){
      box.classList.add('hovered');
    }else{
      box.classList.remove('hovered');
    }
  });
}

// ─── INTERACTION ─────────────────────────────────────────────────────────────
function setupEvents(canvas,wrap){
  // Mouse
  canvas.addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX;lastY=e.clientY;velX=velY=0});
  window.addEventListener('mousemove',e=>{
    if(isDragging){
      velY=(e.clientX-lastX)*0.012;
      velX=(e.clientY-lastY)*0.008;
      rotY+=velY;rotX+=velX;
      rotX=Math.max(-0.55,Math.min(0.55,rotX));
      lastX=e.clientX;lastY=e.clientY;
    }
  });
  window.addEventListener('mouseup',e=>{
    if(isDragging){isDragging=false;checkClick(e,wrap)}
  });

  // Touch
  let t0=null;
  canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    const t=e.touches[0];
    isDragging=true;lastX=t.clientX;lastY=t.clientY;velX=velY=0;t0={x:t.clientX,y:t.clientY,time:Date.now()};
  },{passive:false});
  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(!isDragging)return;
    const t=e.touches[0];
    velY=(t.clientX-lastX)*0.014;
    velX=(t.clientY-lastY)*0.009;
    rotY+=velY;rotX+=velX;
    rotX=Math.max(-0.55,Math.min(0.55,rotX));
    lastX=t.clientX;lastY=t.clientY;
  },{passive:false});
  canvas.addEventListener('touchend',e=>{
    e.preventDefault();
    isDragging=false;
    if(t0){
      const dx=lastX-t0.x,dy=lastY-t0.y,dt=Date.now()-t0.time;
      if(Math.sqrt(dx*dx+dy*dy)<10&&dt<300){
        checkClick({clientX:t0.x,clientY:t0.y},wrap);
      }
    }
  },{passive:false});

  // Resize
  window.addEventListener('resize',()=>{
    const W=wrap.clientWidth,H=wrap.clientHeight;
    camera.aspect=W/H;camera.updateProjectionMatrix();
    renderer.setSize(W,H);
  });
}

function checkClick(e,wrap){
  const rect=wrap.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(figureGroup.children);
  if(hits.length>0){
    const id=hits[0].object.userData.muscleId;
    if(id) openMuscle(id);
  }
}

// ─── ANIMATION LOOP ──────────────────────────────────────────────────────────
function animate(){
  animId=requestAnimationFrame(animate);
  if(!isDragging){
    velY*=0.88;velX*=0.88;
    rotY+=velY;rotX+=velX;
    rotX=Math.max(-0.55,Math.min(0.55,rotX));
    // gentle auto-rotate when idle
    if(Math.abs(velY)<0.001) rotY+=0.002;
  }
  figureGroup.rotation.y=rotY;
  figureGroup.rotation.x=rotX;

  // Hover detection
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(figureGroup.children);
  const newHover=hits.length>0?hits[0].object.userData.muscleId:null;
  if(newHover!==hoveredId){
    // Reset old
    if(hoveredId&&meshMap[hoveredId]){
      meshMap[hoveredId].forEach(m=>{m.material.dispose();m.material=MAT_DEFAULT()});
    }
    // Highlight new
    if(newHover&&meshMap[newHover]){
      meshMap[newHover].forEach(m=>{m.material.dispose();m.material=MAT_HOVER()});
    }
    hoveredId=newHover;
  }
  updateLabelVisibility();
  renderer.render(scene,camera);
}

function renderSets(){

      <input class="set-input" type="number" inputmode="decimal" min="0" step="2.5" placeholder="0" value="${s.weight}" oninput="sets[${i}].weight=this.value">

function addSet(){sets.push({weight:'',reps:''});renderSets()}
function removeSet(i){
  if(sets.length===1){showToast('bro add a set first 💀');return}
  sets.splice(i,1);renderSets();
}
function saveLog(){
  const date=document.getElementById('log-date').value;
  if(!date){showToast('pick a date first');return}
  if(!sets.filter(s=>s.weight!==''||s.reps!=='').length){showToast('you logged nothing twin 😭');return}
  logs[logKey(currentExercise,date)]=sets.map(s=>({weight:s.weight,reps:s.reps}));
  saveData();renderHistory();showToast('locked in ✓');
}
function renderHistory(){
  const hist=getHistory(currentExercise);
  const area=document.getElementById('history-area');
  if(!hist.length){area.innerHTML='<div class="empty-state">nothing here yet twin.<br>go touch some weights.</div>';return}
  area.innerHTML=hist.map((entry,idx)=>{
    const prev=hist[idx+1];
    const isToday=entry.date===today();
    const rows=entry.sets.map((s,si)=>{
      let badges='';
      if(prev&&prev.sets[si]){
        const wD=(parseFloat(s.weight)||0)-(parseFloat(prev.sets[si].weight)||0);
        const rD=(parseInt(s.reps)||0)-(parseInt(prev.sets[si].reps)||0);
        if(wD>0)badges+=`<span class="badge badge-up">+${wD}lb</span>`;
        else if(wD<0)badges+=`<span class="badge badge-down">${wD}lb</span>`;
        if(rD>0)badges+=`<span class="badge badge-up">+${rD}r</span>`;
        else if(rD<0)badges+=`<span class="badge badge-down">${rD}r</span>`;
      }
      return`<div class="hist-row"><span class="hist-set">set ${si+1}: ${s.weight||'—'} lbs × ${s.reps||'—'} reps</span><div class="hist-badges">${badges}</div></div>`;
    }).join('');
    return`<div class="hist-card"><div class="hist-date">${fmtDate(entry.date)}${isToday?'<span class="hist-today">today</span>':''}</div>${rows}</div>`;
  }).join('');
}

    });
    const data=await res.json();
    const text=data.content?.find(b=>b.type==="text")?.text||"ai ghosted us. try again.";
    resp.classList.remove('loading');resp.textContent=text;
    btn.innerHTML='<i class="ti ti-refresh"></i> roast me again';btn.disabled=false;
  }catch(e){
    resp.classList.remove('loading');resp.textContent="wifi dead or something. try again twin.";
    btn.innerHTML='<i class="ti ti-sparkles"></i> retry';btn.disabled=false;
  }
}

// ─── INIT ────────────────────────────────────────────────────────────────────
loadData();
window.addEventListener('load',()=>{
  setTimeout(initThree,100);
});
