<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bloblift">
<title>bloblift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
<style>
:root{
  --bg:#0e0e10;--surface:#18181b;--surface2:#222226;--surface3:#2a2a2f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f4f4f5;--text2:#a1a1aa;--text3:#52525b;
  --accent:#c8f135;--accent-dim:rgba(200,241,53,0.12);--accent-text:#0e0e10;
  --red:#f87171;--red-dim:rgba(248,113,113,0.12);
  --radius:16px;--radius-sm:10px;
  --font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font-body);color:var(--text);font-size:15px}
#app{height:100vh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;overflow:hidden}

/* SCREENS */
@keyframes fadeInUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInScale{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
@keyframes labelPop{0%{opacity:0;transform:translateY(10px) scale(0.94)}70%{opacity:1;transform:translateY(-2px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg)}
.screen.active{display:flex;animation:fadeInUp 0.28s ease both}

/* NAV */
.nav{padding:env(safe-area-inset-top,14px) 20px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--bg);z-index:10}
.nav-title{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px}
.nav-back{display:flex;align-items:center;gap:5px;color:var(--accent);font-size:14px;font-weight:500;background:none;border:none;cursor:pointer;padding:4px 0;font-family:var(--font-body)}

/* HOME 3D SCREEN */
#screen-home{background:var(--bg)}
.home-top{padding:env(safe-area-inset-top,8px) 20px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10;position:relative}
.home-brand{font-family:var(--font-display);font-size:30px;font-weight:800;display:flex;align-items:center;gap:12px;letter-spacing:-0.5px}
.home-brand img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(200,241,53,0.3))}
.home-hint{font-size:11px;color:var(--text3);text-align:center;padding:2px 0 0;z-index:10;position:relative;letter-spacing:0.03em}

/* 3D CANVAS CONTAINER */
#canvas-wrap{flex:1;position:relative;min-height:0}
#three-canvas{width:100%;height:100%;display:block;touch-action:none}

/* MUSCLE LABELS */
.muscle-label{
  position:absolute;
  pointer-events:none;
  opacity:0;
  transform:translateY(8px) scale(0.96);
  transition:
    opacity 0.35s ease,
    transform 0.35s cubic-bezier(0.16,1,0.3,1);
  z-index:5;
}
.muscle-label.visible{
  pointer-events:auto;
  opacity:1;
  transform:translateY(0) scale(1);
}
.label-box{
  background:rgba(24,24,27,0.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(200,241,53,0.28);
  border-radius:999px;
  padding:7px 13px;
  font-family:var(--font-display);
  font-size:11px;
  font-weight:800;
  color:var(--text);
  cursor:pointer;
  white-space:nowrap;
  box-shadow:0 10px 26px rgba(0,0,0,0.28);
  transition:background 0.15s,border-color 0.15s,color 0.15s,transform 0.15s;
}
.label-box:hover,.label-box.hovered{
  background:var(--accent-dim);
  border-color:var(--accent);
  color:var(--accent);
  transform:scale(1.04);
}
.label-line{position:absolute;pointer-events:none}
svg.label-svg{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:visible;
}

/* AI FAB */
.ai-fab{position:absolute;bottom:calc(env(safe-area-inset-bottom,16px) + 16px);left:50%;transform:translateX(-50%);height:68px;padding:0 24px;border-radius:12px;background:rgba(200,241,53,0.12);border:1px solid rgba(200,241,53,0.28);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;z-index:20;box-shadow:0 0 20px rgba(200,241,53,0.15);white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ai-fab:active{transform:translateX(-50%) scale(0.96);background:rgba(200,241,53,0.18)}
.ai-fab-label{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--accent);letter-spacing:0.01em}

/* EXERCISE LIST SCREEN */
.ex-list{padding:0 20px}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background 0.15s;animation:fadeInUp 0.22s ease both}
.ex-card:active{background:var(--surface2)}
.ex-card-name{font-family:var(--font-display);font-size:15px;font-weight:700}
.ex-card-meta{font-size:12px;color:var(--text2);margin-top:2px}
.add-ex-btn{margin:4px 20px 0;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius);padding:14px 16px;width:calc(100% - 40px);display:flex;align-items:center;gap:10px;color:var(--text2);font-size:14px;cursor:pointer;font-family:var(--font-body)}
.add-ex-btn:active{background:var(--surface2)}

/* LOG SCREEN */
.log-header{padding:0 20px 16px}
.log-ex-name{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-0.4px}
.log-muscle{font-size:13px;color:var(--text2);margin-top:3px}
.date-row{padding:0 20px 20px;display:flex;align-items:center;gap:10px}
.date-row label{font-size:13px;color:var(--text2);flex-shrink:0}
.date-row input[type=date]{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:14px;font-family:var(--font-body);outline:none;flex:1}
.date-row input[type=date]:focus{border-color:var(--accent)}
.col-labels{display:grid;grid-template-columns:36px 1fr 1fr 32px;gap:8px;padding:0 20px;margin-bottom:6px}
.col-lbl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:0.05em;text-lowercase:lowercase;text-align:center}
.sets-list{padding:0 20px}
.set-row{display:grid;grid-template-columns:36px 1fr 1fr 32px;gap:8px;align-items:center;margin-bottom:8px}
.set-num{font-size:12px;color:var(--text3);text-align:center;font-weight:600}
.set-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;color:var(--text);font-size:15px;font-family:var(--font-body);text-align:center;outline:none;width:100%}
.set-input:focus{border-color:var(--accent)}
.set-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;padding:4px}
.set-del:active{color:var(--red)}
.action-row{display:flex;gap:10px;padding:12px 20px 20px}
.add-set-btn{flex:1;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius-sm);padding:11px;font-size:14px;color:var(--text2);cursor:pointer;font-family:var(--font-body);display:flex;align-items:center;justify-content:center;gap:6px}
.save-btn{flex:2;background:var(--accent);border:none;border-radius:var(--radius-sm);padding:11px;font-size:14px;font-weight:700;color:var(--accent-text);cursor:pointer;font-family:var(--font-display);display:flex;align-items:center;justify-content:center;gap:6px}
.save-btn:active{opacity:0.85}
.section-label{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:lowercase;color:var(--text3);padding:0 20px;margin-bottom:10px}

/* HISTORY */
.history-wrap{padding:0 20px}
.hist-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;animation:fadeInUp 0.22s ease both}
.hist-date{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.hist-today{background:var(--accent-dim);color:var(--accent);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:lowercase}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-set{font-size:13px}
.hist-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.badge-up{background:rgba(200,241,53,0.1);color:#c8f135}
.badge-down{background:var(--red-dim);color:var(--red)}
.empty-state{text-align:center;padding:2rem 1rem;color:var(--text3);font-size:14px;line-height:1.6}

/* AI SCREEN */
.ai-screen-header{padding:0 20px 16px}
.ai-screen-title{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-0.4px;color:var(--accent)}
.ai-screen-sub{font-size:13px;color:var(--text2);margin-top:4px}
.ai-ex-picker{padding:0 20px 16px}
.ai-ex-picker label{font-size:12px;color:var(--text2);font-weight:500;display:block;margin-bottom:8px}
.ai-select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-size:14px;font-family:var(--font-body);outline:none;appearance:none;-webkit-appearance:none}
.ai-select:focus{border-color:var(--accent)}
.chart-box{margin:0 20px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-height:180px}
.chart-title{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:0.06em;text-transform:lowercase;margin-bottom:12px}
.ai-analyse-btn{margin:0 20px 16px;background:var(--accent-dim);border:1px solid rgba(200,241,53,0.2);border-radius:var(--radius-sm);padding:13px;width:calc(100% - 40px);font-size:14px;font-weight:700;color:var(--accent);cursor:pointer;font-family:var(--font-display);display:flex;align-items:center;justify-content:center;gap:8px}
.ai-analyse-btn:active{opacity:0.8}
.ai-analyse-btn:disabled{opacity:0.4;cursor:default}
.ai-response-box{margin:0 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.ai-response-text{font-size:13px;line-height:1.7;color:var(--text2);white-space:pre-wrap}
.ai-response-text.loading{color:var(--text3)}

/* AI CHAT BUBBLE */
.ai-chat-wrap{display:flex;align-items:flex-start;gap:12px;padding:0 20px 16px}
.chat-wrap{padding:0 20px;display:flex;flex-direction:column;gap:10px}
.chat-msg{display:flex;align-items:flex-start;gap:10px;animation:fadeInUp 0.2s ease both}
.chat-msg.user{flex-direction:row-reverse}
.chat-bubble-user{background:rgba(200,241,53,0.12);border:1px solid rgba(200,241,53,0.25);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:13px;color:var(--text);line-height:1.6;max-width:80%}
.chat-bubble-coach{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:13px;color:var(--text2);line-height:1.6;max-width:80%}
.chat-avatar{width:28px;height:28px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 0 4px rgba(200,241,53,0.3))}
.chat-input-row{display:flex;gap:8px;padding:12px 20px;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border)}
.chat-input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:14px;font-family:var(--font-body);outline:none}
.chat-input:focus{border-color:var(--accent)}
.chat-input:disabled{opacity:0.5}
.chat-send{background:var(--accent);border:none;border-radius:var(--radius-sm);padding:10px 14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--accent-text);font-size:16px}
.chat-send:active{opacity:0.8}
.chat-send:disabled{opacity:0.4;cursor:default}
.chat-limit{text-align:center;font-size:11px;color:var(--text3);padding:8px 20px}
.ai-chat-avatar{width:44px;height:44px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(200,241,53,0.4));margin-top:4px}
.ai-chat-bubble{background:var(--surface);border:1px solid rgba(200,241,53,0.2);border-radius:0 16px 16px 16px;padding:14px 16px;flex:1}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:24px 20px calc(env(safe-area-inset-bottom,16px)+16px);width:100%;max-width:430px;animation:slideUp 0.25s cubic-bezier(0.34,1.26,0.64,1) both}
.modal-title{font-family:var(--font-display);font-size:17px;font-weight:700;margin-bottom:16px}
.modal input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:15px;font-family:var(--font-body);outline:none;margin-bottom:12px}
.modal input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-display);border:none}
.btn-primary{background:var(--accent);color:var(--accent-text)}
.btn-secondary{background:var(--surface2);color:var(--text2)}

/* PHOTO LOG */
.photo-add-btn{background:rgba(14,14,16,0.75);border:1px solid rgba(200,241,53,0.3);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.photo-add-btn:active{background:rgba(200,241,53,0.1)}
.photo-add-label{font-family:var(--font-display);font-size:11px;font-weight:700;color:var(--accent)}
/* CALENDAR */
.cal-wrap{padding:0 16px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:14px}
.cal-nav-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:20px;padding:4px 10px;border-radius:8px}
.cal-nav-btn:active{background:var(--surface2)}
.cal-month{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-0.2px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-dow-label{font-size:10px;font-weight:600;color:var(--text3);text-align:center;text-transform:lowercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{aspect-ratio:1;border-radius:8px;position:relative;overflow:hidden;cursor:pointer;background:var(--surface);border:1px solid var(--border)}
.cal-day:active{opacity:0.8}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default}
.cal-day.today{border-color:rgba(200,241,53,0.5)}
.cal-day.has-photo{border-color:rgba(200,241,53,0.3)}
.cal-day img{width:100%;height:100%;object-fit:cover;display:block}
.cal-day-num{position:absolute;bottom:2px;right:4px;font-size:9px;font-weight:700;color:rgba(255,255,255,0.7);text-shadow:0 1px 3px rgba(0,0,0,0.8);font-family:var(--font-display)}
.cal-day-num.dark{color:rgba(0,0,0,0.6)}
.cal-day-add{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:16px}
.cal-day.today .cal-day-num{color:var(--accent)}
/* PHOTO MODAL */
.photo-modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:150;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.photo-modal.open{display:flex}
.photo-modal img{max-width:100%;max-height:60vh;border-radius:var(--radius);object-fit:contain}
.photo-modal-caption{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text);margin-top:16px;text-align:center}
.photo-modal-date{font-size:12px;color:var(--text3);margin-top:4px}
.photo-modal-actions{display:flex;gap:10px;margin-top:16px}
.photo-modal-close{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 28px;color:var(--text);font-size:14px;cursor:pointer;font-family:var(--font-display)}
.photo-modal-del{background:var(--red-dim);border:1px solid rgba(248,113,113,0.3);border-radius:var(--radius-sm);padding:10px 16px;color:var(--red);font-size:14px;cursor:pointer;font-family:var(--font-display)}
/* TOAST */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,16px)+16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:9px 18px;border-radius:30px;opacity:0;transition:all 0.25s;pointer-events:none;z-index:200;white-space:nowrap;font-family:var(--font-display)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <!-- HOME: 3D MODEL -->
  <div class="screen active" id="screen-home">
    <div class="home-top">
      <div class="home-brand">
        <img src="logo.png" alt="bloblift">
        bloblift
      </div>
      <div style="font-size:12px;color:var(--text3)" id="nav-date"></div>
    </div>
    <div class="home-hint">drag to rotate · tap a muscle to train</div>
    <div style="display:flex;justify-content:center;padding:6px 0 0;z-index:10;position:relative">
      <div class="photo-add-btn" onclick="showScreen('photos')">
        <i class="ti ti-camera" style="color:var(--accent);font-size:14px"></i>
        <span class="photo-add-label">progress photos</span>
      </div>
    </div>
    <div id="canvas-wrap">
      <canvas id="three-canvas"></canvas>
      <div id="model-loading" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8;gap:12px">
        <div style="width:36px;height:36px;border:2px solid rgba(200,241,53,0.15);border-top-color:#c8f135;border-radius:50%;animation:spin 0.8s linear infinite"></div>
        <div style="font-size:12px;color:var(--text3);font-family:var(--font-display)" id="load-pct">loading model...</div>
      </div>
      <svg class="label-svg" id="label-svg"></svg>
      <div id="labels-container"></div>
    </div>
    <input type="file" id="photo-file-input" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">

    <button class="ai-fab" onclick="showScreen('ai')" title="AI Coach">
      <img src="coach.png" alt="" style="width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(200,241,53,0.5))">
      <span class="ai-fab-label">ai coach</span>
    </button>
  </div>

  <!-- EXERCISE LIST -->
  <div class="screen" id="screen-exercises">
    <div class="nav">
      <button class="nav-back" onclick="showScreen('home')"><i class="ti ti-arrow-left"></i> home</button>
      <div class="nav-title" id="muscle-screen-title"></div>
      <div style="width:60px"></div>
    </div>
    <div class="ex-list" id="exercise-list"></div>
    <button class="add-ex-btn" onclick="openAddExercise()">
      <i class="ti ti-plus" style="font-size:18px"></i> add custom exercise
    </button>
    <div style="height:2rem"></div>
  </div>

  <!-- LOG SCREEN -->
  <div class="screen" id="screen-log">
    <div class="nav">
      <button class="nav-back" id="log-back-btn"><i class="ti ti-arrow-left"></i> <span id="log-back-label">back</span></button>
      <div style="width:60px"></div>
    </div>
    <div class="log-header">
      <div class="log-ex-name" id="log-ex-name"></div>
      <div class="log-muscle" id="log-ex-muscle"></div>
    </div>
    <div class="date-row">
      <label>date</label>
      <input type="date" id="log-date">
    </div>
    <div class="col-labels">
      <div class="col-lbl"></div>
      <div class="col-lbl">weight</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const MUSCLES = [
  {id:'chest',    name:'chest',     exercises:['Bench Press','Incline Bench Press','Dumbbell Fly','Cable Fly','Chest Dip','Push-Up']},
  {id:'back',     name:'back',      exercises:['Deadlift','Pull-Up','Barbell Row','Seated Cable Row','Lat Pulldown','Single-Arm Row']},
  {id:'shoulders',name:'shoulders', exercises:['Overhead Press','Lateral Raise','Front Raise','Face Pull','Arnold Press','Shrug']},
  {id:'legs',     name:'legs',      exercises:['Squat','Romanian Deadlift','Leg Press','Leg Curl','Leg Extension','Hip Thrust','Calf Raise','Glute Bridge','Bulgarian Split Squat','Sumo Deadlift','Abductor Machine']},
  {id:'biceps',   name:'biceps',    exercises:['Barbell Curl','Dumbbell Curl','Hammer Curl','Preacher Curl','Cable Curl','Incline Curl']},
  {id:'triceps',  name:'triceps',   exercises:['Skull Crusher','Tricep Pushdown','Overhead Extension','Close-Grip Bench','Dip','Kickback']},
  {id:'core',     name:'core',      exercises:['Plank','Cable Crunch','Hanging Leg Raise','Ab Wheel','Russian Twist','Side Plank']},
];

let currentMuscle=null,currentExercise=null,sets=[],logs={},customExercises={};

function loadData(){
  try{logs=JSON.parse(localStorage.getItem('bloblift_logs')||'{}')}catch(e){logs={}}
  try{customExercises=JSON.parse(localStorage.getItem('bloblift_custom')||'{}')}catch(e){customExercises={}}
}
function saveData(){try{localStorage.setItem('bloblift_logs',JSON.stringify(logs))}catch(e){}}
function saveCustom(){try{localStorage.setItem('bloblift_custom',JSON.stringify(customExercises))}catch(e){}}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){
  if(!d)return'';
  const[y,m,day]=d.split('-');
  return['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][+m-1]+' '+ +day;
}
function logKey(ex,date){return ex+'__'+date}
function getHistory(ex){
  return Object.keys(logs).filter(k=>k.startsWith(ex+'__'))
    .map(k=>({date:k.split('__')[1],sets:logs[k]}))
    .sort((a,b)=>b.date.localeCompare(a.date));
}
function getLastEntry(ex){const h=getHistory(ex);return h[0]||null}
function getAllExercises(){
  const all=new Set();
  MUSCLES.forEach(m=>getExercisesForMuscle(m.id).forEach(e=>all.add(e)));
  return[...all].sort();
}
function getExercisesForMuscle(id){
  const m=MUSCLES.find(x=>x.id===id);
  return[...(m?m.exercises:[]),...(customExercises[id]||[])];
}

// ─── SCREENS ─────────────────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  if(id==='ai'){renderAIScreen();resetChat();}
  if(id==='photos'){renderCalendar();}
  if(id==='home')updateLabels();
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ─── THREE.JS ─────────────────────────────────────────────────────────────────
let scene,camera,renderer,figureGroup;
let labelEls={};
let rotY=0.2,rotX=0.0,velY=0,velX=0,isDragging=false,lastX=0,lastY=0;
let modelLoaded=false;

// Anatomically calibrated label anchors from real vertex data
// Y values measured from actual model bounds (-0.952 to 0.951)
const LABEL_ANCHORS={
  shoulders:{x:-0.18, y: 0.66, z: 0.12, side:'front', labelX:-120, labelY:-36},
  chest:    {x: 0.00, y: 0.43, z: 0.24, side:'front', labelX:  72, labelY:-18},
  biceps:   {x: 0.46, y: 0.47, z: 0.14, side:'front', labelX:  62, labelY: 20},
  core:     {x: 0.00, y: 0.17, z: 0.24, side:'front', labelX:-122, labelY: 10},
  legs:     {x: 0.22, y:-0.33, z: 0.14, side:'front', labelX:  68, labelY: 30},
  back:     {x: 0.00, y: 0.50, z:-0.24, side:'back',  labelX:-124, labelY:-18},
  triceps:  {x: 0.43, y: 0.43, z:-0.16, side:'back',  labelX:  66, labelY: 18},
};

function initThree(){
  const wrap=document.getElementById('canvas-wrap');
  const canvas=document.getElementById('three-canvas');
  const W=wrap.clientWidth,H=wrap.clientHeight;

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0e0e10);

  camera=new THREE.PerspectiveCamera(44,W/H,0.01,100);
  camera.position.set(0,0,3.2);
  camera.lookAt(0,0,0);

  renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2.5));
  renderer.setSize(W,H);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;

  // ── Lighting — strong multi-directional so computed normals always show depth ──
  // Heavy ambient so no face ever goes fully black
  scene.add(new THREE.AmbientLight(0xffffff,1.2));

  // Front key — slightly warm
  const key=new THREE.DirectionalLight(0xffffff,1.8);
  key.position.set(1,2,4);key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  scene.add(key);

  // Left fill
  const fill=new THREE.DirectionalLight(0xdddddd,1.0);
  fill.position.set(-3,1,1);scene.add(fill);

  // Right fill
  const fill2=new THREE.DirectionalLight(0xdddddd,1.0);
  fill2.position.set(3,1,1);scene.add(fill2);

  // Rim from behind — lime tint for style
  const rim=new THREE.DirectionalLight(0xc8f135,1.4);
  rim.position.set(0,2,-4);scene.add(rim);

  // Top light
  const top=new THREE.DirectionalLight(0xffffff,0.8);
  top.position.set(0,6,0);scene.add(top);

  // Bottom bounce
  const bot=new THREE.PointLight(0xaaaaaa,1.0,8);
  bot.position.set(0,-2,2);scene.add(bot);

  figureGroup=new THREE.Group();
  scene.add(figureGroup);

  // Load GLB
  const loader=new THREE.GLTFLoader();
  // Show spinner while loading
  document.getElementById('model-loading').style.display='flex';
  loader.load('model.glb',gltf=>{
    const model=gltf.scene;

    // Tint entire model lime green
    model.traverse(child=>{
      if(child.isMesh){
        child.castShadow=true;
        child.receiveShadow=true;
        child.geometry.computeVertexNormals();
        // Use MeshNormalMaterial as guaranteed fallback - always visible regardless of lights
        child.geometry.computeVertexNormals();
        child.material=new THREE.MeshPhongMaterial({
          color:0x8aba2a,
          emissive:0x1a3a04,
          specular:0xaade44,
          shininess:55,
          flatShading:false,
        });
      }
    });

    // Center and scale model to fit viewport
    const box=new THREE.Box3().setFromObject(model);
    const size=box.getSize(new THREE.Vector3());
    const center=box.getCenter(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z);
    const scale=1.35/maxDim;
    model.scale.setScalar(scale);
    model.position.sub(center.multiplyScalar(scale));

    figureGroup.add(model);
    modelLoaded=true;
    document.getElementById('model-loading').style.display='none';
  },
  xhr=>{
    const pct=Math.round(xhr.loaded/xhr.total*100);
    document.getElementById('load-pct').textContent=pct+'%';
  },
  err=>console.error('GLB load error:',err));

  buildLabels();
  setupEvents(canvas,wrap);
  animate();
  updateDate();
}

// ─── LABELS ──────────────────────────────────────────────────────────────────
function buildLabels(){
  const container=document.getElementById('labels-container');
  const svg=document.getElementById('label-svg');
  container.innerHTML='';svg.innerHTML='';labelEls={};

  MUSCLES.forEach(m=>{
    const div=document.createElement('div');
    div.className='muscle-label';div.dataset.id=m.id;div.style.setProperty('--pop-delay',(90+Array.from(MUSCLES).indexOf(m)*55)+'ms');
    const hasData=getLastEntry(m.exercises?.[0])||false;
    div.innerHTML=`<div class="label-box" data-id="${m.id}">${m.name}</div>`;
    div.querySelector('.label-box').addEventListener('click',()=>openMuscle(m.id));
    container.appendChild(div);

    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('stroke','rgba(200,241,53,0.38)');
    line.setAttribute('stroke-width','1.1');
    line.setAttribute('stroke-dasharray','4,3');
    svg.appendChild(line);

    // Dot at anchor point
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('r','2.6');
    dot.setAttribute('fill','rgba(200,241,53,0.7)');
    svg.appendChild(dot);

    labelEls[m.id]={el:div,box:div.querySelector('.label-box'),line,dot};
  });
}

function project3D(wx,wy,wz){
  const wrap=document.getElementById('canvas-wrap');
  const W=wrap.clientWidth,H=wrap.clientHeight;
  const vec=new THREE.Vector3(wx,wy,wz);
  vec.applyEuler(new THREE.Euler(rotX,rotY,0,'XYZ'));
  vec.project(camera);
  return{x:(vec.x*0.5+0.5)*W,y:(-vec.y*0.5+0.5)*H,z:vec.z};
}

function updateLabels(){
  if(!labelEls||!camera)return;
  const wrap=document.getElementById('canvas-wrap');
  if(!wrap)return;
  const W=wrap.clientWidth,H=wrap.clientHeight;
  const fc=Math.cos(rotY);

  MUSCLES.forEach(m=>{
    const a=LABEL_ANCHORS[m.id];
    const{el,box,line,dot}=labelEls[m.id];
    if(!a){el.classList.remove('visible');return;}

    let visible=false;
    if(a.side==='front'&&fc>0.15)visible=true;
    if(a.side==='back' &&fc<-0.15)visible=true;
    if(Math.abs(fc)<0.22)visible=true;

    if(!visible){
      el.classList.remove('visible');
      line.setAttribute('opacity','0');dot.setAttribute('opacity','0');return;
    }

    const pt=project3D(a.x,a.y,a.z);
    if(pt.z>1){el.classList.remove('visible');return;}
    el.classList.add('visible');

    const LW=96, LH=32;
    let lx = pt.x + a.labelX;
    let ly = pt.y + a.labelY;

    // Flip label side on back/side rotation so it stays readable and avoids stacking.
    if(fc < -0.15){
      lx = pt.x - a.labelX - LW;
    }

    // Keep labels safely inside the app frame.
    lx = Math.max(8, Math.min(W - LW - 8, lx));
    ly = Math.max(12, Math.min(H - LH - 12, ly));

    el.style.left=lx+'px';
    el.style.top=ly+'px';
    el.style.width=LW+'px';

    // Draw the connector from label center to the muscle dot for a cleaner UX.
    const lcx = lx + LW / 2;
    const lcy = ly + LH / 2;
    line.setAttribute('x1',lcx);line.setAttribute('y1',lcy);
    line.setAttribute('x2',pt.x);line.setAttribute('y2',pt.y);
    line.setAttribute('opacity','0.62');
    dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);
    dot.setAttribute('opacity','0.85');

    box.classList.toggle('hovered',false);
  });
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
function setupEvents(canvas,wrap){
  canvas.addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX;lastY=e.clientY;velX=velY=0});
  window.addEventListener('mousemove',e=>{
    if(!isDragging)return;
    velY=(e.clientX-lastX)*0.013;velX=(e.clientY-lastY)*0.009;
    rotY+=velY;rotX+=velX;rotX=Math.max(-0.55,Math.min(0.55,rotX));
    lastX=e.clientX;lastY=e.clientY;
  });
  window.addEventListener('mouseup',()=>{isDragging=false;});

  let t0=null;
  canvas.addEventListener('touchstart',e=>{
    e.preventDefault();const t=e.touches[0];
    isDragging=true;lastX=t.clientX;lastY=t.clientY;velX=velY=0;
    t0={x:t.clientX,y:t.clientY,time:Date.now()};
  },{passive:false});
  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();if(!isDragging)return;const t=e.touches[0];
    velY=(t.clientX-lastX)*0.015;
    rotY+=velY;
    lastX=t.clientX;lastY=t.clientY;
  },{passive:false});
  canvas.addEventListener('touchend',e=>{
    e.preventDefault();isDragging=false;
  },{passive:false});

  window.addEventListener('resize',()=>{
    const W=wrap.clientWidth,H=wrap.clientHeight;
    camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);
  });
}

// ─── ANIMATE ─────────────────────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  if(!isDragging){
    velY*=0.88;
    rotY+=velY;
    if(Math.abs(velY)<0.0012)rotY+=0.0016;
  }
  if(figureGroup){figureGroup.rotation.y=rotY;figureGroup.rotation.x=0;}
  updateLabels();
  renderer.render(scene,camera);
}

function updateDate(){
  document.getElementById('nav-date').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

// ─── EXERCISE LIST ────────────────────────────────────────────────────────────
function openMuscle(id){
  currentMuscle=MUSCLES.find(m=>m.id===id);
  document.getElementById('muscle-screen-title').textContent=currentMuscle.name;
  renderExerciseList();showScreen('exercises');
}
function renderExerciseList(){
  document.getElementById('exercise-list').innerHTML=getExercisesForMuscle(currentMuscle.id).map((ex,idx)=>{
    const last=getLastEntry(ex);
    const meta=last?`last: ${fmtDate(last.date)} · ${last.sets.length} set${last.sets.length!==1?'s':''}`:'no logs yet — get to work';
    return`<div class="ex-card" onclick="openExercise('${ex}')" style="animation-delay:${idx*0.04}s"><div><div class="ex-card-name">${ex}</div><div class="ex-card-meta">${meta}</div></div><i class="ti ti-chevron-right" style="color:var(--text3);font-size:18px"></i></div>`;
  }).join('');
}
function openAddExercise(){
  document.getElementById('new-ex-name').value='';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('new-ex-name').focus(),100);
}
function closeAddExercise(){document.getElementById('modal-overlay').classList.remove('open')}
function closeModal(e){if(e.target===document.getElementById('modal-overlay'))closeAddExercise()}
function confirmAddExercise(){
  const name=document.getElementById('new-ex-name').value.trim();
  if(!name){showToast('give it a name first');return}
  const id=currentMuscle.id;
  if(!customExercises[id])customExercises[id]=[];
  if(getExercisesForMuscle(id).map(e=>e.toLowerCase()).includes(name.toLowerCase())){showToast('already in there bro');return}
  customExercises[id].push(name);saveCustom();closeAddExercise();renderExerciseList();
  showToast('added to the list 💪');
}

// ─── LOG ──────────────────────────────────────────────────────────────────────
function openExercise(ex){
  currentExercise=ex;
  document.getElementById('log-ex-name').textContent=ex;
  document.getElementById('log-ex-muscle').textContent=(currentMuscle?currentMuscle.name+' · ':'')+'log your sets';
  document.getElementById('log-back-label').textContent=currentMuscle?currentMuscle.name:'back';
  document.getElementById('log-back-btn').onclick=currentMuscle?()=>openMuscle(currentMuscle.id):()=>showScreen('home');
  document.getElementById('log-date').value=today();
  const existing=logs[logKey(ex,today())];
  sets=existing?JSON.parse(JSON.stringify(existing)):[{weight:'',reps:''}];
  renderSets();renderHistory();showScreen('log');
}
function renderSets(){
  document.getElementById('sets-container').innerHTML=sets.map((s,i)=>`
    <div class="set-row">
      <div class="set-num">s${i+1}</div>
      <input class="set-input" type="number" inputmode="decimal" min="0" step="2.5" placeholder="0" value="${s.weight}" oninput="sets[${i}].weight=this.value">
      <input class="set-input" type="number" inputmode="numeric" min="0" placeholder="0" value="${s.reps}" oninput="sets[${i}].reps=this.value">
      <button class="set-del" onclick="removeSet(${i})"><i class="ti ti-x"></i></button>
    </div>`).join('');
}
function addSet(){sets.push({weight:'',reps:''});renderSets()}
function removeSet(i){
  if(sets.length===1){showToast('bro add a set first 💀');return}
  sets.splice(i,1);renderSets();
}
function saveLog(){
  const date=document.getElementById('log-date').value;
  if(!date){showToast('pick a date first');return}
  if(!sets.filter(s=>s.weight!==''||s.reps!=='').length){showToast('you logged nothing twin 😭');return}
  logs[logKey(currentExercise,date)]=sets.map(s=>({weight:s.weight,reps:s.reps}));
  saveData();renderHistory();showToast('locked in ✓');
}
function renderHistory(){
  const hist=getHistory(currentExercise);
  const area=document.getElementById('history-area');
  if(!hist.length){area.innerHTML='<div class="empty-state">nothing here yet twin.<br>go touch some weights.</div>';return}
  area.innerHTML=hist.map((entry,idx)=>{
    const prev=hist[idx+1];const isToday=entry.date===today();
    const rows=entry.sets.map((s,si)=>{
      let badges='';
      if(prev&&prev.sets[si]){
        const wD=(parseFloat(s.weight)||0)-(parseFloat(prev.sets[si].weight)||0);
        const rD=(parseInt(s.reps)||0)-(parseInt(prev.sets[si].reps)||0);
        if(wD>0)badges+=`<span class="badge badge-up">+${wD}lb</span>`;
        else if(wD<0)badges+=`<span class="badge badge-down">${wD}lb</span>`;
        if(rD>0)badges+=`<span class="badge badge-up">+${rD}r</span>`;
        else if(rD<0)badges+=`<span class="badge badge-down">${rD}r</span>`;
      }
      return`<div class="hist-row"><span class="hist-set">set ${si+1}: ${s.weight||'—'} lbs × ${s.reps||'—'} reps</span><div class="hist-badges">${badges}</div></div>`;
    }).join('');
    return`<div class="hist-card" style="animation-delay:${idx*0.05}s"><div class="hist-date">${fmtDate(entry.date)}${isToday?'<span class="hist-today">today</span>':''}</div>${rows}</div>`;
  }).join('');
}

// ─── AI SCREEN ────────────────────────────────────────────────────────────────
let progressChart=null;
function renderAIScreen(){
  const select=document.getElementById('ai-ex-select');
  const allEx=getAllExercises().filter(ex=>getHistory(ex).length>0);
  select.innerHTML=allEx.length?allEx.map(ex=>`<option value="${ex}">${ex}</option>`).join(''):'<option>no exercises logged yet</option>';
  document.getElementById('ai-analyse-btn').disabled=false;
  document.getElementById('ai-analyse-btn').innerHTML='<i class="ti ti-sparkles"></i> lets see the damage';
  renderChart(select.value);
}
function onAIExerciseChange(){
  const ex=document.getElementById('ai-ex-select').value;
  document.getElementById('ai-analyse-btn').disabled=false;
  document.getElementById('ai-analyse-btn').innerHTML='<i class="ti ti-sparkles"></i> lets see the damage';
  renderChart(ex);
}
function renderChart(ex){
  const hist=getHistory(ex).reverse();
  const canvas=document.getElementById('progressChart');
  const empty=document.getElementById('chart-empty');
  if(progressChart){progressChart.destroy();progressChart=null}
  if(!hist.length||!ex){canvas.style.display='none';empty.style.display='block';return}
  canvas.style.display='block';empty.style.display='none';
  const labels=hist.map(h=>fmtDate(h.date));
  const data=hist.map(h=>Math.max(...h.sets.map(s=>parseFloat(s.weight)||0)));
  progressChart=new Chart(canvas,{
    type:'line',
    data:{labels,datasets:[{data,borderColor:'#c8f135',borderWidth:2,pointBackgroundColor:'#c8f135',pointRadius:4,fill:true,backgroundColor:'rgba(200,241,53,0.07)',tension:0.35}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:{backgroundColor:'#222226',titleColor:'#f4f4f5',bodyColor:'#a1a1aa',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,callbacks:{label:ctx=>ctx.parsed.y+' lbs'}}},scales:{x:{ticks:{color:'#52525b',font:{size:11}},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#52525b',font:{size:11},callback:v=>v+'lb'},grid:{color:'rgba(255,255,255,0.04)'}}}}
  });
}
const WORKER_URL='https://bloblift-ai.luckyentry380.workers.dev/ai';
const MAX_CHAT_MSGS=10;
let chatHistory=[];
let chatMsgCount=0;
let currentChatExercise=null;

function resetChat(){
  chatHistory=[];chatMsgCount=0;currentChatExercise=null;
  document.getElementById('chat-wrap').innerHTML='';
  document.getElementById('chat-input-row').style.display='none';
  document.getElementById('chat-limit').style.display='none';
}

function appendMsg(role,text){
  const wrap=document.getElementById('chat-wrap');
  const isUser=role==='user';
  const div=document.createElement('div');
  div.className='chat-msg '+(isUser?'user':'coach');
  div.innerHTML=isUser
    ?`<div class="chat-bubble-user">${text}</div>`
    :`<img src="coach.png" class="chat-avatar"><div class="chat-bubble-coach">${text}</div>`;
  wrap.appendChild(div);
  div.scrollIntoView({behavior:'smooth',block:'end'});
}

function appendTyping(){
  const wrap=document.getElementById('chat-wrap');
  const div=document.createElement('div');
  div.className='chat-msg coach';div.id='typing-indicator';
  div.innerHTML='<img src="coach.png" class="chat-avatar"><div class="chat-bubble-coach" style="color:var(--text3)">typing...</div>';
  wrap.appendChild(div);
  div.scrollIntoView({behavior:'smooth',block:'end'});
}

function removeTyping(){
  const t=document.getElementById('typing-indicator');
  if(t)t.remove();
}

function updateChatLimit(){
  const remaining=MAX_CHAT_MSGS-chatMsgCount;
  const limitEl=document.getElementById('chat-limit');
  const input=document.getElementById('chat-input');
  const send=document.getElementById('chat-send');
  if(remaining<=3&&remaining>0){
    limitEl.style.display='block';
    limitEl.textContent=`${remaining} message${remaining!==1?'s':''} left this session`;
  }
  if(remaining<=0){
    limitEl.style.display='block';
    limitEl.textContent='session limit reached — come back after logging more sets 💪';
    input.disabled=true;send.disabled=true;
  }
}

async function askAI(){
  const ex=document.getElementById('ai-ex-select').value;
  const btn=document.getElementById('ai-analyse-btn');
  const hist=getHistory(ex);
  if(!hist.length){showToast('no data yet — go log something');return}
  resetChat();
  currentChatExercise=ex;
  btn.disabled=true;btn.innerHTML='<i class="ti ti-loader"></i> cooking...';
  const summary=hist.slice(0,8).map(h=>{
    const allSets=h.sets.map((s,i)=>`set ${i+1}: ${s.weight||0}lbs x ${s.reps||0} reps`).join(', ');
    return`${fmtDate(h.date)}: ${allSets}`;
  }).join('\n');
  chatHistory=[{role:'user',content:`my sessions for ${ex}:\n\n${summary}\n\nanalyse my progress and tell me exactly what to hit next session.`}];
  appendTyping();
  try{
    const res=await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:chatHistory})
    });
    const data=await res.json();
    removeTyping();
    if(data.error){appendMsg('coach','error: '+data.error);btn.innerHTML='<i class="ti ti-refresh"></i> try again';btn.disabled=false;return;}
    chatHistory.push({role:'assistant',content:data.response});
    chatMsgCount++;
    appendMsg('coach',data.response);
    document.getElementById('chat-input-row').style.display='flex';
    updateChatLimit();
    btn.innerHTML='<i class="ti ti-refresh"></i> restart analysis';btn.disabled=false;
  }catch(e){
    removeTyping();
    appendMsg('coach','network error: '+e.message);
    btn.innerHTML='<i class="ti ti-sparkles"></i> retry';btn.disabled=false;
  }
}

async function sendChat(){
  const input=document.getElementById('chat-input');
  const send=document.getElementById('chat-send');
  const msg=input.value.trim();
  if(!msg)return;
  if(chatMsgCount>=MAX_CHAT_MSGS){showToast('session limit reached 💀');return}
  input.value='';input.disabled=true;send.disabled=true;
  appendMsg('user',msg);
  chatHistory.push({role:'user',content:msg});
  chatMsgCount++;
  appendTyping();
  try{
    const res=await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:chatHistory})
    });
    const data=await res.json();
    removeTyping();
    if(data.error){appendMsg('coach','error: '+data.error);input.disabled=false;send.disabled=false;return;}
    chatHistory.push({role:'assistant',content:data.response});
    appendMsg('coach',data.response);
    updateChatLimit();
    if(chatMsgCount<MAX_CHAT_MSGS){input.disabled=false;send.disabled=false;input.focus();}
  }catch(e){
    removeTyping();
    appendMsg('coach','network error — try again');
    input.disabled=false;send.disabled=false;
  }
}

// ─── PHOTOS + CALENDAR ───────────────────────────────────────────────────────
let pendingPhotoData=null;
let pendingPhotoDate=null;
let viewingPhotoId=null;
let calOffset=0; // months offset from current

function loadPhotos(){
  try{return JSON.parse(localStorage.getItem('bloblift_photos')||'[]')}catch(e){return[]}
}
function savePhotos(photos){
  try{localStorage.setItem('bloblift_photos',JSON.stringify(photos))}catch(e){showToast('storage full — delete some photos')}
}
function photoByDate(dateStr){
  return loadPhotos().find(p=>p.date===dateStr)||null;
}

// Compress image before storing to save localStorage space
function compressImage(dataUrl, maxW=600){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=img.width*scale;
      canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL('image/jpeg',0.72));
    };
    img.src=dataUrl;
  });
}

function handlePhotoUpload(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    pendingPhotoData=await compressImage(e.target.result);
    document.getElementById('caption-input').value='';
    document.getElementById('caption-modal-overlay').style.display='flex';
    setTimeout(()=>document.getElementById('caption-input').focus(),100);
  };
  reader.readAsDataURL(file);
  event.target.value='';
}

function tapCalDay(dateStr){
  const existing=photoByDate(dateStr);
  if(existing){openPhotoModal(existing.id);return;}
  // Only allow adding photos to today or past
  if(dateStr>today()){showToast('cannot add future photos');return;}
  pendingPhotoDate=dateStr;
  document.getElementById('photo-file-input').click();
}

function closeCaptionModal(e){
  if(e&&e.target!==document.getElementById('caption-modal-overlay'))return;
  document.getElementById('caption-modal-overlay').style.display='none';
  pendingPhotoData=null;pendingPhotoDate=null;
}

function savePhoto(){
  if(!pendingPhotoData){showToast('no photo selected');return}
  const caption=document.getElementById('caption-input').value.trim()||'workout log';
  const photos=loadPhotos();
  const dateToUse=pendingPhotoDate||today();
  // Remove existing photo for that date if any
  const filtered=photos.filter(p=>p.date!==dateToUse);
  filtered.unshift({id:Date.now(),data:pendingPhotoData,caption,date:dateToUse});
  savePhotos(filtered);
  pendingPhotoData=null;pendingPhotoDate=null;
  document.getElementById('caption-modal-overlay').style.display='none';
  renderCalendar();
  showToast('photo saved 📸');
}

function calShift(dir){
  calOffset+=dir;
  renderCalendar();
}

function renderCalendar(){
  const now=new Date();
  const target=new Date(now.getFullYear(),now.getMonth()+calOffset,1);
  const year=target.getFullYear();
  const month=target.getMonth();
  const months=['january','february','march','april','may','june','july','august','september','october','november','december'];
  document.getElementById('cal-month-label').textContent=months[month]+' '+year;

  const firstDow=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayStr=today();
  const photos=loadPhotos();
  const photoMap={};
  photos.forEach(p=>{photoMap[p.date]=p;});

  let cells='';
  // Empty cells before first day
  for(let i=0;i<firstDow;i++) cells+=`<div class="cal-day empty"></div>`;
  // Day cells
  for(let d=1;d<=daysInMonth;d++){
    const mm=String(month+1).padStart(2,'0');
    const dd=String(d).padStart(2,'0');
    const dateStr=`${year}-${mm}-${dd}`;
    const p=photoMap[dateStr];
    const isToday=dateStr===todayStr;
    const isFuture=dateStr>todayStr;
    if(p){
      cells+=`<div class="cal-day has-photo${isToday?' today':''}" onclick="tapCalDay('${dateStr}')">
        <img src="${p.data}" alt="${p.caption}">
        <span class="cal-day-num dark">${d}</span>
      </div>`;
    } else if(isFuture){
      cells+=`<div class="cal-day empty" style="background:var(--surface);border:1px solid var(--border);opacity:0.3">
        <div class="cal-day-add"></div>
        <span class="cal-day-num">${d}</span>
      </div>`;
    } else {
      cells+=`<div class="cal-day${isToday?' today':''}" onclick="tapCalDay('${dateStr}')">
        <div class="cal-day-add"><i class="ti ti-plus" style="font-size:12px"></i></div>
        <span class="cal-day-num">${d}</span>
      </div>`;
    }
  }
  document.getElementById('cal-grid').innerHTML=cells;
}

function openPhotoModal(id){
  const p=loadPhotos().find(x=>x.id===id);
  if(!p)return;
  viewingPhotoId=id;
  document.getElementById('photo-modal-img').src=p.data;
  document.getElementById('photo-modal-caption').textContent=p.caption;
  document.getElementById('photo-modal-date').textContent=fmtDate(p.date);
  document.getElementById('photo-modal').classList.add('open');
}

function closePhotoModal(){
  document.getElementById('photo-modal').classList.remove('open');
  viewingPhotoId=null;
}

function deletePhotoFromModal(){
  if(!viewingPhotoId)return;
  const photos=loadPhotos().filter(p=>p.id!==viewingPhotoId);
  savePhotos(photos);
  closePhotoModal();
  renderCalendar();
  showToast('photo deleted 🗑️');
}
